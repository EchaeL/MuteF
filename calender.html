<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --line: #2b2b2b;
    --input: #f4f4f4;
    --input-text: #171717;

    /* 이 페이지(흰 배경)용 색 */
    --page-bg: #ffffff;
    --page-text: #111111;
    --cell-select: #e2e2e2;
    --myeongjo: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "바탕", serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    color: var(--page-text);
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    position: relative;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  /* 흰 배경이므로 MuteF 글씨는 검은색 (위치는 Home과 동일) */
  .site-title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    color: #000;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  /* ───── 사이드바: Home.html과 동일 ───── */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(280px, 82vw);
    height: 100vh;
    background: #181818;
    border-right: 1px solid var(--line);
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 24px 18px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }

  .sidebar-link:hover {
    background: #222;
  }

  .sidebar-link.active {
    background: #222;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }

  .home-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-button {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 42px;
    height: 42px;
    padding: 8px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 10;
  }

  /* 흰 배경이므로 햄버거 버튼은 검은색 */
  .menu-button span {
    display: block;
    width: 24px;
    height: 2px;
    margin: 5px auto;
    background: #000;
    border-radius: 2px;
  }

  @media (max-width: 480px) {
    .menu-button {
      top: 12px;
      left: 12px;
    }
  }
  /* ───── 사이드바 끝 ───── */

  .hidden {
    display: none !important;
  }

  main {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 84px 16px 28px;
  }

  /* 검은 띠로 둘러진 둥근 직사각형 — 상단 가운데가 끊기고 그 자리에 제목 */
  .frame {
    width: min(560px, 100%);
    margin: 0;
    padding: 18px 18px 22px;
    border: 3px solid #000;
    border-radius: 22px;
    min-width: 0;
  }

  .frame-title {
    margin: 0 auto;
    padding: 0 14px;
    font-family: var(--myeongjo);
    font-size: 24px;
    font-weight: 700;
    color: #000;
    line-height: 1;
  }

  /* ───── 달력 ───── */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 6px 0 16px;
  }

  .cal-label {
    min-width: 7.5em;
    text-align: center;
    font-family: var(--myeongjo);
    font-size: 20px;
    font-weight: 700;
    user-select: none;
  }

  .cal-arrow {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .cal-arrow:hover {
    background: #f0f0f0;
  }

  .cal-body {
    touch-action: pan-y;   /* 세로 스크롤은 허용, 가로 스와이프는 직접 처리 */
    user-select: none;
  }

  .weekdays,
  .days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }

  .weekdays {
    margin-bottom: 6px;
  }

  .weekdays div {
    text-align: center;
    font-family: var(--myeongjo);
    font-size: 13px;
    color: #555;
    padding: 4px 0;
  }

  .day {
    position: relative;
    min-width: 0;
    overflow: hidden;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .day:hover {
    background: #f5f5f5;
  }

  .day.empty {
    cursor: default;
    pointer-events: none;
  }

  /* 오늘 날짜: 검은색 칸 + 흰색 숫자 */
  .day.today {
    background: #000;
    color: #fff;
  }

  /* 선택한 칸: 회색 박스 + 기호 */
  .day .plus {
    display: none;
  }

  .day.selected,
  .day.today.selected {
    background: var(--cell-select);
    color: #000;
  }

  .day.selected .num,
  .day.selected .titles {
    display: none;
  }

  /* 일정이 있는 날: 숫자 대신 일정 이름 */
  .day .titles {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    padding: 0 3px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 11px;
    line-height: 1.25;
    text-align: center;
  }

  /* 일정 하나: 최대 2줄 / 여러 개: 한 줄씩 — 넘치면 … */
  .day .titles span {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    word-break: break-all;
  }

  .day .titles.multi span {
    -webkit-line-clamp: 1;
  }

  .day .titles .more {
    color: #888;
    font-size: 10px;
  }

  .day.today .titles .more {
    color: #bbb;
  }

  .day.selected .plus {
    display: block;
    font-size: 26px;
    line-height: 1;
  }

  /* ───── 일정 생성 화면 ───── */
  .create-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 6px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .field-label {
    font-family: var(--myeongjo);
    font-size: 14px;
    font-weight: 700;
    color: #444;
  }

  /* 제목(반) + 날짜(반) */
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .create-form input[type="text"],
  .create-form input[type="url"],
  .create-form input[type="date"],
  .create-form textarea {
    display: block;
    width: 100%;
    min-width: 0;
    height: 46px;
    padding: 0 12px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    background: #fafafa;
    color: #111;
    font-size: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    outline: none;
  }

  .create-form textarea {
    height: 72px;
    padding: 10px 12px;
    resize: vertical;
  }

  .create-form input:focus,
  .create-form textarea:focus {
    border-color: #000;
  }

  /* 장소: 이름 + 링크 */
  .place-row {
    display: grid;
    grid-template-columns: 2fr 3fr;
    gap: 8px;
  }

  /* 참여 인원: 스크롤 목록 + 체크박스 */
  .member-list {
    max-height: 168px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .member {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #e3e3e3;
    border-radius: 6px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 15px;
    color: #111;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .member input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .check-box {
    flex: 0 0 20px;
    width: 20px;
    height: 20px;
    border: 2px solid #000;
    border-radius: 3px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-box svg {
    width: 14px;
    height: 14px;
    visibility: hidden;
  }

  /* 선택되면 체크박스를 채우고 아이디 박스를 회색으로 */
  .member.checked {
    background: var(--cell-select);
    border-color: #cfcfcf;
  }

  .member.checked .check-box {
    background: #000;
  }

  .member.checked .check-box svg {
    visibility: visible;
  }

  .member input:focus-visible + .check-box {
    outline: 2px solid #000;
    outline-offset: 2px;
  }

  .member-count {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    color: #777;
  }

  .create-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  .create-actions button {
    flex: 1;
    height: 46px;
    border: 1px solid #000;
    border-radius: 6px;
    background: #fff;
    color: #000;
    font-family: var(--myeongjo);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .create-actions .primary {
    background: #000;
    color: #fff;
  }

  .create-note {
    min-height: 20px;
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #777;
  }

  @media (max-width: 480px) {
    main {
      padding-top: 76px;
    }

    .frame {
      padding: 14px 10px 18px;
      border-radius: 18px;
    }

    .day {
      font-size: 15px;
    }
  }
</style>
</head>

<body>
  <header class="site-header">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">×</button>

      <nav class="sidebar-nav">
        <button class="sidebar-link" id="homeLink" type="button">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.2Z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
          </svg>
          <span>Home</span>
        </button>
      </nav>
    </aside>

    <button class="menu-button" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="site-title">MuteF</div>
  </header>

  <main>
    <!-- 화면 1: 달력 -->
    <fieldset class="frame" id="calendarScreen">
      <legend class="frame-title">일정</legend>

      <div class="cal-head">
        <button class="cal-arrow" id="prevMonth" type="button" aria-label="이전 달">&lsaquo;</button>
        <div class="cal-label" id="calLabel" aria-live="polite"></div>
        <button class="cal-arrow" id="nextMonth" type="button" aria-label="다음 달">&rsaquo;</button>
      </div>

      <div class="cal-body" id="calBody">
        <div class="weekdays">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="days" id="days"></div>
      </div>
    </fieldset>

    <!-- 화면 2: 일정 생성 (같은 html 안의 다른 화면 — 지금은 더미) -->
    <fieldset class="frame hidden" id="createScreen">
      <legend class="frame-title">일정 생성</legend>

      <form class="create-form" id="createForm" autocomplete="off" novalidate>
        <!-- 제목 + 날짜 -->
        <div class="field-row">
          <label class="field">
            <span class="field-label">제목</span>
            <input id="eventTitle" type="text" placeholder="일정 제목">
          </label>
          <label class="field">
            <span class="field-label">날짜</span>
            <input id="eventDate" type="date">
          </label>
        </div>

        <!-- 장소 -->
        <div class="field">
          <label class="field-label" for="placeName">장소</label>
          <div class="place-row">
            <input id="placeName" type="text" placeholder="장소 이름">
            <input id="placeLink" type="url" placeholder="링크 (https://...)" aria-label="장소 링크" inputmode="url">
          </div>
        </div>

        <!-- 참여 인원 -->
        <div class="field">
          <span class="field-label">참여 인원 <span class="member-count" id="memberCount"></span></span>
          <div class="member-list" id="memberList" role="group" aria-label="참여 인원"></div>
        </div>

        <!-- 메모 -->
        <label class="field">
          <span class="field-label">메모</span>
          <textarea id="eventMemo" placeholder="메모"></textarea>
        </label>

        <div class="create-actions">
          <button type="button" id="cancelCreate">취소</button>
          <button type="submit" class="primary" id="saveCreate">저장</button>
        </div>
      </form>

      <div class="create-note" id="createNote" aria-live="polite"></div>
    </fieldset>
  </main>

  <script>
    /* ───── 사이드바 ───── */
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const homeLink = document.getElementById("homeLink");

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    document.querySelector(".menu-button").addEventListener("click", openSidebar);
    document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // 파일 이름이나 위치가 바뀌면 아래 경로만 수정하면 됩니다.
    const HOME_URL = "Home.html";

    homeLink.addEventListener("click", function() {
      homeLink.classList.add("active");
      window.location.href = HOME_URL;
    });

    /* ───── 달력 ───── */
    const calLabel = document.getElementById("calLabel");
    const daysEl = document.getElementById("days");
    const calBody = document.getElementById("calBody");

    const today = new Date();                // 시스템 시간 기준
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();        // 0 ~ 11
    let selectedKey = null;                  // "YYYY-MM-DD"
    let openedFromCalendar = false;          // 달력에서 + 를 눌러 들어왔는지

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function dateKey(y, m, d) {
      return `${y}-${pad(m + 1)}-${pad(d)}`;
    }

    /* ───── 일정 저장 (이 브라우저의 localStorage) ───── */
    const STORAGE_KEY = "mutef-events";

    function loadEvents() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveEvents(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        return true;
      } catch (e) {
        return false;
      }
    }

    let events = loadEvents();

    function eventsOn(key) {
      return events.filter(ev => ev.date === key);
    }

    function renderCalendar() {
      calLabel.textContent = `${viewYear}년 ${viewMonth + 1}월`;
      daysEl.innerHTML = "";

      const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstWeekday; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        daysEl.appendChild(blank);
      }

      for (let d = 1; d <= lastDate; d++) {
        const key = dateKey(viewYear, viewMonth, d);
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day";
        cell.dataset.key = key;
        cell.setAttribute("aria-label", `${viewMonth + 1}월 ${d}일`);
        const dayEvents = eventsOn(key);

        if (dayEvents.length) {
          // 일정이 있으면 날짜 숫자 대신 일정 이름 (최대 2개, 나머지는 +N)
          const titles = document.createElement("span");
          titles.className = dayEvents.length > 1 ? "titles multi" : "titles";
          dayEvents.slice(0, 2).forEach(ev => {
            const t = document.createElement("span");
            t.textContent = ev.title;
            titles.appendChild(t);
          });
          if (dayEvents.length > 2) {
            const more = document.createElement("span");
            more.className = "more";
            more.textContent = `+${dayEvents.length - 2}`;
            titles.appendChild(more);
          }
          cell.appendChild(titles);
          cell.setAttribute("aria-label",
            `${viewMonth + 1}월 ${d}일, 일정: ${dayEvents.map(ev => ev.title).join(", ")}`);
        } else {
          cell.insertAdjacentHTML("beforeend", `<span class="num">${d}</span>`);
        }
        cell.insertAdjacentHTML("beforeend", `<span class="plus" aria-hidden="true">+</span>`);

        if (
          viewYear === today.getFullYear() &&
          viewMonth === today.getMonth() &&
          d === today.getDate()
        ) {
          cell.classList.add("today");
        }

        if (key === selectedKey) {
          cell.classList.add("selected");
        }

        daysEl.appendChild(cell);
      }
    }

    // 날짜 칸 클릭: 첫 번째 → 회색 박스 + 기호, 두 번째(+ 누름) → 일정 생성 화면
    daysEl.addEventListener("click", function(event) {
      const cell = event.target.closest(".day:not(.empty)");
      if (!cell) return;

      if (cell.dataset.key === selectedKey) {
        openedFromCalendar = true;
        navigate(`create/${selectedKey}`);
        return;
      }

      selectedKey = cell.dataset.key;
      daysEl.querySelectorAll(".day.selected").forEach(el => el.classList.remove("selected"));
      cell.classList.add("selected");
    });

    function moveMonth(step) {
      viewMonth += step;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      selectedKey = null;
      renderCalendar();
    }

    document.getElementById("prevMonth").addEventListener("click", () => moveMonth(-1));
    document.getElementById("nextMonth").addEventListener("click", () => moveMonth(1));

    // 옆으로 넘기기(스와이프 / 드래그)로 월 이동
    let swipeStartX = null;
    let swipeStartY = null;
    let swiped = false;

    calBody.addEventListener("pointerdown", function(event) {
      swipeStartX = event.clientX;
      swipeStartY = event.clientY;
      swiped = false;
    });

    calBody.addEventListener("pointerup", function(event) {
      if (swipeStartX === null) return;
      const dx = event.clientX - swipeStartX;
      const dy = event.clientY - swipeStartY;
      swipeStartX = null;

      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        swiped = true;
        moveMonth(dx < 0 ? 1 : -1);   // 왼쪽으로 넘기면 다음 달
      }
    });

    calBody.addEventListener("pointercancel", function() {
      swipeStartX = null;
    });

    // 스와이프 직후 발생하는 클릭은 무시 (날짜가 선택되지 않도록)
    calBody.addEventListener("click", function(event) {
      if (swiped) {
        event.stopPropagation();
        swiped = false;
      }
    }, true);

    /* ───── 화면 전환 (같은 html, 주소의 #으로 구분) ───── */
    const calendarScreen = document.getElementById("calendarScreen");
    const createScreen = document.getElementById("createScreen");
    const eventDate = document.getElementById("eventDate");
    const eventTitle = document.getElementById("eventTitle");
    const placeName = document.getElementById("placeName");
    const placeLink = document.getElementById("placeLink");
    const eventMemo = document.getElementById("eventMemo");
    const memberList = document.getElementById("memberList");
    const memberCount = document.getElementById("memberCount");
    const createForm = document.getElementById("createForm");
    const createNote = document.getElementById("createNote");

    // 지금 보여줄 화면. 주소의 #도 같이 바꾸지만, 미리보기처럼 주소를 못 바꾸는
    // 환경에서도 화면 전환이 되도록 이 값을 기준으로 화면을 그림
    let currentRoute = location.hash.slice(1);

    function setHash(route) {
      try {
        if (location.hash.slice(1) !== route) location.hash = route;
      } catch (e) { /* 주소를 못 바꾸는 환경 — 무시 */ }
    }

    function navigate(route) {
      currentRoute = route;
      setHash(route);
      showScreen();
    }

    function showScreen() {
      const match = currentRoute.match(/^create\/(\d{4})-(\d{2})-(\d{2})$/);

      if (match) {
        const [, y, m, d] = match;
        createForm.reset();
        eventDate.value = `${y}-${m}-${d}`;   // 달력에서 선택한 날짜가 기본값
        updateMembers();
        createNote.textContent = "";
        calendarScreen.classList.add("hidden");
        createScreen.classList.remove("hidden");
      } else {
        createScreen.classList.add("hidden");
        calendarScreen.classList.remove("hidden");
      }
      window.scrollTo(0, 0);
    }

    function backToCalendar() {
      if (openedFromCalendar) {
        openedFromCalendar = false;
        currentRoute = "";
        showScreen();
        try { history.back(); } catch (e) { /* 무시 */ }
      } else {
        navigate("");
      }
    }

    // 생성 화면에서 날짜를 바꾸면 주소(#create/날짜)도 같이 바꿔 둠 — 새로고침해도 유지
    eventDate.addEventListener("change", function() {
      if (/^\d{4}-\d{2}-\d{2}$/.test(eventDate.value)) {
        currentRoute = `create/${eventDate.value}`;
        try {
          history.replaceState(null, "", `#${currentRoute}`);
        } catch (e) { /* 주소를 못 바꾸는 환경 — 무시 */ }
      }
    });

    // 참여 인원 — index.html의 아이디 목록에서 관리자(echae)·테스트용(friend1, friend2)을 뺀 것
    const MEMBERS = [
      "권은서",
      "정수인",
      "김서현",
      "이선우",
      "김현재",
      "한경원"
    ];

    MEMBERS.forEach(function(name) {
      const item = document.createElement("label");
      item.className = "member";
      item.innerHTML = `
        <input type="checkbox" name="members" value="${name}">
        <span class="check-box" aria-hidden="true">
          <svg viewBox="0 0 14 14"><path d="M2.5 7.2 5.6 10.2 11.5 3.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>${name}</span>`;
      memberList.appendChild(item);
    });

    function updateMembers() {
      let count = 0;
      memberList.querySelectorAll(".member").forEach(function(item) {
        const checked = item.querySelector("input").checked;
        item.classList.toggle("checked", checked);
        if (checked) count++;
      });
      memberCount.textContent = count ? `(${count}명)` : "";
    }

    memberList.addEventListener("change", updateMembers);

    document.getElementById("cancelCreate").addEventListener("click", backToCalendar);

    // 저장: 이 브라우저에 저장하고 달력으로 돌아감
    // 미리보기 화면 등 폼 제출이 막힌 환경에서도 작동하도록
    // 폼 submit 대신 저장 버튼 클릭으로 직접 처리 (index.html과 같은 방식)
    function saveEvent() {
      const title = eventTitle.value.trim();
      const date = eventDate.value;

      if (!title) {
        createNote.textContent = "제목을 입력해 주세요.";
        eventTitle.focus();
        return;
      }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        createNote.textContent = "날짜를 선택해 주세요.";
        eventDate.focus();
        return;
      }

      let link = placeLink.value.trim();
      if (link && !/^https?:\/\//i.test(link)) {
        link = "https://" + link;
      }

      const newEvent = {
        id: Date.now().toString(36),
        title,
        date,
        place: { name: placeName.value.trim(), link },
        members: [...memberList.querySelectorAll("input:checked")].map(el => el.value),
        memo: eventMemo.value.trim()
      };

      // 브라우저 저장이 막힌 환경이어도 지금 화면에는 보이도록 목록에는 항상 추가
      events.push(newEvent);
      saveEvents(events);

      // 저장한 날짜가 있는 달을 보여줌
      const [y, m] = date.split("-").map(Number);
      viewYear = y;
      viewMonth = m - 1;
      selectedKey = null;
      renderCalendar();
      backToCalendar();
    }

    document.getElementById("saveCreate").addEventListener("click", function(event) {
      event.preventDefault();
      saveEvent();
    });

    createForm.addEventListener("submit", function(event) {
      event.preventDefault();
    });

    window.addEventListener("hashchange", function() {
      currentRoute = location.hash.slice(1);
      showScreen();
    });

    renderCalendar();
    showScreen();
  </script>
</body>
</html>
