<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --line: #2b2b2b;
    --input: #f4f4f4;
    --input-text: #171717;

    /* 이 페이지(흰 배경)용 색 */
    --page-bg: #ffffff;
    --page-text: #111111;
    --cell-select: #e2e2e2;
    --myeongjo: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "바탕", serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    color: var(--page-text);
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    position: relative;
  }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  /* 흰 배경이므로 MuteF 글씨는 검은색 (위치는 Home과 동일) */
  .site-title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    color: #000;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  /* ───── 사이드바: Home.html과 동일 ───── */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(280px, 82vw);
    height: 100vh;
    background: #181818;
    border-right: 1px solid var(--line);
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 24px 18px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }

  .sidebar-link:hover {
    background: #222;
  }

  .sidebar-link.active {
    background: #222;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }

  .home-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-button {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 42px;
    height: 42px;
    padding: 8px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 10;
  }

  /* 흰 배경이므로 햄버거 버튼은 검은색 */
  .menu-button span {
    display: block;
    width: 24px;
    height: 2px;
    margin: 5px auto;
    background: #000;
    border-radius: 2px;
  }

  @media (max-width: 480px) {
    .menu-button {
      top: 12px;
      left: 12px;
    }
  }
  /* ───── 사이드바 끝 ───── */

  .hidden {
    display: none !important;
  }

  main {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 84px 16px 28px;
  }

  /* 검은 띠로 둘러진 둥근 직사각형 — 상단 가운데가 끊기고 그 자리에 제목 */
  .frame {
    width: min(560px, 100%);
    margin: 0;
    padding: 18px 18px 22px;
    border: 3px solid #000;
    border-radius: 22px;
    min-width: 0;
  }

  .frame-title {
    margin: 0 auto;
    padding: 0 14px;
    font-family: var(--myeongjo);
    font-size: 24px;
    font-weight: 700;
    color: #000;
    line-height: 1;
  }

  /* ───── 달력 ───── */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 6px 0 16px;
  }

  .cal-label {
    min-width: 7.5em;
    text-align: center;
    font-family: var(--myeongjo);
    font-size: 20px;
    font-weight: 700;
    user-select: none;
  }

  .cal-arrow {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .cal-arrow:hover {
    background: #f0f0f0;
  }

  .cal-body {
    touch-action: pan-y;   /* 세로 스크롤은 허용, 가로 스와이프는 직접 처리 */
    user-select: none;
  }

  .weekdays,
  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .weekdays {
    margin-bottom: 6px;
  }

  .weekdays div {
    text-align: center;
    font-family: var(--myeongjo);
    font-size: 13px;
    color: #555;
    padding: 4px 0;
  }

  .day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .day:hover {
    background: #f5f5f5;
  }

  .day.empty {
    cursor: default;
    pointer-events: none;
  }

  /* 오늘 날짜: 검은색 칸 + 흰색 숫자 */
  .day.today {
    background: #000;
    color: #fff;
  }

  /* 선택한 칸: 회색 박스 + 기호 */
  .day .plus {
    display: none;
  }

  .day.selected,
  .day.today.selected {
    background: var(--cell-select);
    color: #000;
  }

  .day.selected .num {
    display: none;
  }

  .day.selected .plus {
    display: block;
    font-size: 26px;
    line-height: 1;
  }

  /* ───── 일정 생성 화면 (더미) ───── */
  .create-date {
    margin: 6px 0 20px;
    text-align: center;
    font-family: var(--myeongjo);
    font-size: 18px;
    font-weight: 700;
  }

  .create-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .create-form label {
    font-family: var(--myeongjo);
    font-size: 14px;
    color: #444;
  }

  .create-form input,
  .create-form textarea {
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    background: #fafafa;
    color: #111;
    font-size: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    outline: none;
  }

  .create-form textarea {
    min-height: 110px;
    resize: vertical;
  }

  .create-form input:focus,
  .create-form textarea:focus {
    border-color: #000;
  }

  .create-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  .create-actions button {
    flex: 1;
    height: 46px;
    border: 1px solid #000;
    border-radius: 6px;
    background: #fff;
    color: #000;
    font-family: var(--myeongjo);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .create-actions .primary {
    background: #000;
    color: #fff;
  }

  .create-note {
    min-height: 20px;
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #777;
  }

  @media (max-width: 480px) {
    main {
      padding-top: 76px;
    }

    .frame {
      padding: 14px 10px 18px;
      border-radius: 18px;
    }

    .day {
      font-size: 15px;
    }
  }
</style>
</head>

<body>
  <header class="site-header">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">×</button>

      <nav class="sidebar-nav">
        <button class="sidebar-link" id="homeLink" type="button">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.2Z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
          </svg>
          <span>Home</span>
        </button>
      </nav>
    </aside>

    <button class="menu-button" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="site-title">MuteF</div>
  </header>

  <main>
    <!-- 화면 1: 달력 -->
    <fieldset class="frame" id="calendarScreen">
      <legend class="frame-title">일정</legend>

      <div class="cal-head">
        <button class="cal-arrow" id="prevMonth" type="button" aria-label="이전 달">&lsaquo;</button>
        <div class="cal-label" id="calLabel" aria-live="polite"></div>
        <button class="cal-arrow" id="nextMonth" type="button" aria-label="다음 달">&rsaquo;</button>
      </div>

      <div class="cal-body" id="calBody">
        <div class="weekdays">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="days" id="days"></div>
      </div>
    </fieldset>

    <!-- 화면 2: 일정 생성 (같은 html 안의 다른 화면 — 지금은 더미) -->
    <fieldset class="frame hidden" id="createScreen">
      <legend class="frame-title">일정 생성</legend>

      <div class="create-date" id="createDate"></div>

      <form class="create-form" id="createForm">
        <label>제목
          <input id="eventTitle" type="text" placeholder="일정 제목">
        </label>
        <label>메모
          <textarea id="eventMemo" placeholder="메모"></textarea>
        </label>
        <div class="create-actions">
          <button type="button" id="cancelCreate">취소</button>
          <button type="submit" class="primary">저장</button>
        </div>
      </form>

      <div class="create-note" id="createNote" aria-live="polite"></div>
    </fieldset>
  </main>

  <script>
    /* ───── 사이드바 ───── */
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const homeLink = document.getElementById("homeLink");

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    document.querySelector(".menu-button").addEventListener("click", openSidebar);
    document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // 파일 이름이나 위치가 바뀌면 아래 경로만 수정하면 됩니다.
    const HOME_URL = "Home.html";

    homeLink.addEventListener("click", function() {
      homeLink.classList.add("active");
      window.location.href = HOME_URL;
    });

    /* ───── 달력 ───── */
    const calLabel = document.getElementById("calLabel");
    const daysEl = document.getElementById("days");
    const calBody = document.getElementById("calBody");

    const today = new Date();                // 시스템 시간 기준
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();        // 0 ~ 11
    let selectedKey = null;                  // "YYYY-MM-DD"
    let openedFromCalendar = false;          // 달력에서 + 를 눌러 들어왔는지

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function dateKey(y, m, d) {
      return `${y}-${pad(m + 1)}-${pad(d)}`;
    }

    function renderCalendar() {
      calLabel.textContent = `${viewYear}년 ${viewMonth + 1}월`;
      daysEl.innerHTML = "";

      const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstWeekday; i++) {
        const blank = document.createElement("div");
        blank.className = "day empty";
        daysEl.appendChild(blank);
      }

      for (let d = 1; d <= lastDate; d++) {
        const key = dateKey(viewYear, viewMonth, d);
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day";
        cell.dataset.key = key;
        cell.setAttribute("aria-label", `${viewMonth + 1}월 ${d}일`);
        cell.innerHTML = `<span class="num">${d}</span><span class="plus" aria-hidden="true">+</span>`;

        if (
          viewYear === today.getFullYear() &&
          viewMonth === today.getMonth() &&
          d === today.getDate()
        ) {
          cell.classList.add("today");
        }

        if (key === selectedKey) {
          cell.classList.add("selected");
        }

        daysEl.appendChild(cell);
      }
    }

    // 날짜 칸 클릭: 첫 번째 → 회색 박스 + 기호, 두 번째(+ 누름) → 일정 생성 화면
    daysEl.addEventListener("click", function(event) {
      const cell = event.target.closest(".day:not(.empty)");
      if (!cell) return;

      if (cell.dataset.key === selectedKey) {
        openedFromCalendar = true;
        location.hash = `create/${selectedKey}`;
        return;
      }

      selectedKey = cell.dataset.key;
      daysEl.querySelectorAll(".day.selected").forEach(el => el.classList.remove("selected"));
      cell.classList.add("selected");
    });

    function moveMonth(step) {
      viewMonth += step;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      selectedKey = null;
      renderCalendar();
    }

    document.getElementById("prevMonth").addEventListener("click", () => moveMonth(-1));
    document.getElementById("nextMonth").addEventListener("click", () => moveMonth(1));

    // 옆으로 넘기기(스와이프 / 드래그)로 월 이동
    let swipeStartX = null;
    let swipeStartY = null;
    let swiped = false;

    calBody.addEventListener("pointerdown", function(event) {
      swipeStartX = event.clientX;
      swipeStartY = event.clientY;
      swiped = false;
    });

    calBody.addEventListener("pointerup", function(event) {
      if (swipeStartX === null) return;
      const dx = event.clientX - swipeStartX;
      const dy = event.clientY - swipeStartY;
      swipeStartX = null;

      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        swiped = true;
        moveMonth(dx < 0 ? 1 : -1);   // 왼쪽으로 넘기면 다음 달
      }
    });

    calBody.addEventListener("pointercancel", function() {
      swipeStartX = null;
    });

    // 스와이프 직후 발생하는 클릭은 무시 (날짜가 선택되지 않도록)
    calBody.addEventListener("click", function(event) {
      if (swiped) {
        event.stopPropagation();
        swiped = false;
      }
    }, true);

    /* ───── 화면 전환 (같은 html, 주소의 #으로 구분) ───── */
    const calendarScreen = document.getElementById("calendarScreen");
    const createScreen = document.getElementById("createScreen");
    const createDate = document.getElementById("createDate");
    const createForm = document.getElementById("createForm");
    const createNote = document.getElementById("createNote");

    function showScreen() {
      const match = location.hash.match(/^#create\/(\d{4})-(\d{2})-(\d{2})$/);

      if (match) {
        const [, y, m, d] = match;
        createDate.textContent = `${Number(y)}년 ${Number(m)}월 ${Number(d)}일`;
        createForm.reset();
        createNote.textContent = "";
        calendarScreen.classList.add("hidden");
        createScreen.classList.remove("hidden");
      } else {
        createScreen.classList.add("hidden");
        calendarScreen.classList.remove("hidden");
      }
      window.scrollTo(0, 0);
    }

    function backToCalendar() {
      if (openedFromCalendar) {
        openedFromCalendar = false;
        history.back();
      } else {
        location.hash = "";
      }
    }

    document.getElementById("cancelCreate").addEventListener("click", backToCalendar);

    // 더미 저장 — 나중에 실제 저장 기능을 여기에 붙이면 됩니다.
    createForm.addEventListener("submit", function(event) {
      event.preventDefault();
      createNote.textContent = "아직 저장 기능은 준비 중이에요.";
    });

    window.addEventListener("hashchange", showScreen);

    renderCalendar();
    showScreen();
  </script>
</body>
</html>
