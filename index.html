<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome!</title>
<style>
  :root {
    --bg: #121212;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --line: #2b2b2b;
    --input: #f4f4f4;
    --input-text: #171717;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
  }


  /* =========================
     SIDEBAR (홈 화면과 동일)
     ========================= */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(280px, 82vw);
    height: 100vh;
    height: 100dvh;           /* 휴대폰: 주소창·하단바를 뺀 실제 보이는 높이 */
    background: #181818;
    border-right: 1px solid #2b2b2b;
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 24px 18px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }

  .sidebar-link:hover {
    background: #222;
  }

  .home-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
  }

  /* 사이드바: 메뉴는 위, 프로필은 맨 아래 */
  .sidebar {
    display: flex;
    flex-direction: column;
    overflow-y: auto;         /* 화면이 낮으면 사이드바 안에서 스크롤 */
  }

  .sidebar-profile {
    margin-top: auto;
    margin-bottom: 28px;      /* 맨 밑에 붙지 않게 조금 위로 */
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 12px 4px;
    border-top: 1px solid #2b2b2b;
    color: #f5f5f5;
  }

  .sidebar-profile {
    position: relative;
  }

  /* 프로필 사진: 없으면 검은 바탕에 흰 흉상 (기본 이미지) */
  .avatar {
    display: block;
    overflow: hidden;
    border-radius: 50%;
    background: #000;
  }

  .avatar img,
  .avatar svg {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-avatar {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid #555;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .profile-avatar:disabled {
    cursor: default;
  }

  /* 프로필 사진을 누르면 뜨는 메뉴 */
  .profile-menu {
    position: absolute;
    left: 10px;
    bottom: calc(100% - 6px);
    z-index: 1;
    min-width: 140px;
    padding: 4px;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    background: #222;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }

  .profile-menu button {
    display: block;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }

  .profile-menu button:hover {
    background: #2e2e2e;
  }

  .profile-note {
    margin-top: 2px;
    color: #a8a8a8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 12px;
  }

  .profile-info {
    min-width: 0;
  }

  .profile-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
  }

  .profile-action {
    margin-top: 3px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #a8a8a8;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .profile-action:hover {
    color: #f5f5f5;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-button {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 42px;
    height: 42px;
    padding: 8px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 10;
  }

  .menu-button span {
    display: block;
    width: 24px;
    height: 2px;
    margin: 5px auto;
    background: var(--text);
    border-radius: 2px;
  }

  /* Home을 누르면 생기는 박스 — 다른 곳을 누르면 사라짐 */
  .sidebar-link.active {
    background: #222;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }

  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .welcome {
    width: min(440px, 100%);
    text-align: center;
  }

  h1 {
    margin: 0 0 34px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(46px, 13vw, 70px);
    font-style: italic;
    font-weight: 400;
    letter-spacing: -2.5px;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input {
    width: 100%;
    height: 54px;
    padding: 0 18px;
    border: 1px solid #d8d8d8;
    border-radius: 3px;
    background: var(--input);
    color: var(--input-text);
    font-size: 16px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: normal;
    outline: none;
  }

  input::placeholder {
    color: #555;
  }

  input:focus {
    border-color: white;
    box-shadow: 0 0 0 2px rgba(255,255,255,.12);
  }

  button[type="submit"] {
    height: 50px;
    border: 1px solid #555;
    border-radius: 3px;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: normal;
    cursor: pointer;
  }

  button[type="submit"]:active {
    background: #222;
  }

  .message {
    min-height: 20px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 14px;
    font-style: normal;
  }

  .hidden {
    display: none;
  }

  .home {
    text-align: center;
  }

  .home h2 {
    margin: 0 0 10px;
    font-size: 34px;
    font-weight: 500;
  }

  .home p {
    color: var(--muted);
  }

  /* 입력칸(enter your ID)과 로그인 후 화면(Welcome! / Logged in as)은 기본 시스템 폰트 */
  input,
  .home h2,
  .home p {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  /* 로그인 후 화면의 HOME 글자 — 누르면 Home.html로 */
  .home-text-link {
    margin-top: 18px;
    padding: 6px 4px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    letter-spacing: 1px;
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-color: rgba(255,255,255,.35);
    cursor: pointer;
  }

  .home-text-link:hover {
    text-decoration-color: var(--text);
  }

  @media (max-width: 480px) {
    .menu-button {
      top: 12px;
      left: 12px;
    }

    h1 {
      margin-bottom: 28px;
    }
  }

</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar" aria-label="Main menu">
  <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">×</button>

  <nav class="sidebar-nav">
    <button class="sidebar-link" type="button" data-href="Home.html">
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.2Z"
              fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linejoin="round"/>
      </svg>
      <span>Home</span>
    </button>
    <button class="sidebar-link" type="button" data-href="calender.html">
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15.5" rx="1.5"
              fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3.5 9.8h17M8 3v4M16 3v4"
              fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round"/>
      </svg>
      <span>Schedule</span>
    </button>
    <button class="sidebar-link" type="button" data-href="members.html">
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3.2"
                fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3.5 19.5c0-3.2 2.5-5.6 5.5-5.6s5.5 2.4 5.5 5.6M16.3 5.6a2.8 2.8 0 0 1 0 5.4M17 14.1c2.1.5 3.5 2.6 3.5 5.4"
              fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round"/>
      </svg>
      <span>Members</span>
    </button>
    <button class="sidebar-link" type="button" data-href="timeline.html">
      <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"
                fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 7.5V12l3 2"
              fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Timeline</span>
    </button>
  </nav>

  <!-- 로그인한 ID 프로필 (사이드바 맨 아래) -->
  <div class="sidebar-profile">
    <button class="profile-avatar avatar" id="profileAvatar" type="button" aria-label="프로필 사진"></button>
    <input type="file" id="avatarInput" accept="image/*" hidden>
    <div class="profile-menu hidden" id="profileMenu">
      <button type="button" id="avatarChange">사진 변경</button>
      <button type="button" id="avatarReset">기본 이미지로</button>
    </div>
    <div class="profile-info">
      <div class="profile-name" id="profileName"></div>
      <button class="profile-action" id="profileAction" type="button"></button>
      <div class="profile-note hidden" id="profileNote" aria-live="polite"></div>
    </div>
  </div>
</aside>


<button class="menu-button" type="button" aria-label="Menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<main>
  <section class="welcome" id="loginScreen">
    <h1>Welcome!</h1>

    <form class="login-form" id="loginForm">
      <input
        id="userId"
        type="text"
        placeholder="enter your ID"
        autocomplete="username"
        required
      >
      <button type="submit">ENTER</button>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </section>

  <section class="home hidden" id="homeScreen">
    <h2>Welcome!</h2>
    <p id="loggedInAs"></p>
    <button class="home-text-link" id="goHome" type="button">HOME</button>
  </section>
</main>

<script>
  /*
    지금은 테스트용으로 허용된 ID를 여기서 관리합니다.
    나중에 실제 계정 시스템을 붙일 때 이 부분을 데이터베이스로 바꾸면 됩니다.
  */
  const allowedIDs = [
    "echae",
    "friend1",
    "friend2",
    "권은서",
    "정수인",
    "김서현",
    "이선우",
    "김현재",
    "한경원",
    "한지후"
  ];

  const loginScreen = document.getElementById("loginScreen");
  const homeScreen = document.getElementById("homeScreen");
  const loginForm = document.getElementById("loginForm");
  const userIdInput = document.getElementById("userId");
  const message = document.getElementById("message");
  const loggedInAs = document.getElementById("loggedInAs");

  // 로그인 판정 — 이 파일에는 로그인 처리 코드가 없어서,
  // 처음 보내주신 파일(같은 ID 목록·같은 문구)의 로직을 사용
  function tryLogin() {
    const id = userIdInput.value.trim();

    if (!id) return;

    const matchedID = allowedIDs.find(
      allowed => allowed.toLowerCase() === id.toLowerCase()
    );

    if (!matchedID) {
      message.textContent = "This ID isn't registered.";
      return;
    }

    message.textContent = "";

    // 다른 화면(사이드바 프로필 등)에서도 알 수 있게 로그인한 ID를 저장
    try {
      localStorage.setItem(USER_KEY, matchedID);
    } catch (e) { /* 저장이 막힌 환경 — 이 화면에서만 로그인 상태 */ }

    showLoggedIn(matchedID);
    renderProfile();
  }

  function showLoggedIn(id) {
    loginScreen.classList.add("hidden");
    homeScreen.classList.remove("hidden");
    loggedInAs.textContent = `Logged in as ${id}`;
  }

  // 미리보기 화면 등 폼 제출이 막힌 환경에서도 작동하도록
  // 폼 submit 대신 ENTER 버튼 클릭과 키보드 Enter로 직접 처리
  loginForm.querySelector('button[type="submit"]').addEventListener("click", function(event) {
    event.preventDefault();
    tryLogin();
  });

  userIdInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      tryLogin();
    }
  });

  loginForm.addEventListener("submit", function(event) {
    event.preventDefault();
  });

  document.getElementById("goHome").addEventListener("click", function() {
    window.location.href = "Home.html";
  });

  const sidebar = document.getElementById("sidebar");
  const sidebarOverlay = document.getElementById("sidebarOverlay");

  function openSidebar() {
    sidebar.classList.add("open");
    sidebarOverlay.classList.add("open");
  }

  function closeSidebar() {
    sidebar.classList.remove("open");
    sidebarOverlay.classList.remove("open");
  }

  document.querySelector(".menu-button").addEventListener("click", openSidebar);
  document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
  sidebarOverlay.addEventListener("click", closeSidebar);

  // 사이드바 메뉴: 누르면 박스 표시 후 해당 파일로 이동
  // 파일 이름이나 위치가 바뀌면 각 버튼의 data-href만 수정하면 됩니다.
  const sidebarLinks = document.querySelectorAll(".sidebar-link");

  sidebarLinks.forEach(function(link) {
    link.addEventListener("click", function() {
      // 로그인 후 화면(Logged in as)일 때만 작동
      if (homeScreen.classList.contains("hidden")) return;

      link.classList.add("active");
      window.location.href = link.dataset.href;
    });
  });

  // ───── 사이드바 아래 프로필: index.html에서 로그인한 ID ─────
  // (이 브라우저에 저장된 값이라 진짜 보안 로그인은 아님)
  const USER_KEY = "mutef-user";

  function getCurrentUser() {
    try {
      return localStorage.getItem(USER_KEY);
    } catch (e) {
      return null;
    }
  }

  // ───── 프로필 사진 (Supabase: profiles 표 + avatars 사진 보관함) ─────
  const PROFILE_DB = {
    url: "https://xbvormcnoexpxtjoioko.supabase.co",
    key: "sb_publishable_WUlX-m46GveYJsrJ837LsQ_732EGb8R"
  };
  const AVATAR_CACHE_KEY = "mutef-avatar";   // 화면을 열자마자 보이도록 이 브라우저에 기억

  // 기본 이미지: 검은 바탕에 흰 흉상
  const DEFAULT_AVATAR = `<svg viewBox="0 0 40 40" aria-hidden="true">
    <rect width="40" height="40" fill="#000"/>
    <circle cx="20" cy="15.5" r="7" fill="#fff"/>
    <path d="M5 40c0-8.6 6.7-14.5 15-14.5S35 31.4 35 40Z" fill="#fff"/>
  </svg>`;

  function avatarUrl(path) {
    return `${PROFILE_DB.url}/storage/v1/object/public/avatars/${path}`;
  }

  // el 안에 프로필 사진(없으면 기본 이미지)을 그림
  function fillAvatar(el, path) {
    el.innerHTML = "";
    if (path) {
      const img = document.createElement("img");
      img.src = avatarUrl(path);
      img.alt = "";
      img.onerror = () => { el.innerHTML = DEFAULT_AVATAR; };
      el.appendChild(img);
    } else {
      el.innerHTML = DEFAULT_AVATAR;
    }
  }

  function readAvatarCache() {
    try {
      const cache = JSON.parse(localStorage.getItem(AVATAR_CACHE_KEY));
      return cache && cache.id === getCurrentUser() ? cache.path : "";
    } catch (e) {
      return "";
    }
  }

  function writeAvatarCache(path) {
    try {
      localStorage.setItem(AVATAR_CACHE_KEY, JSON.stringify({ id: getCurrentUser(), path }));
    } catch (e) { /* 무시 */ }
  }

  function renderProfile() {
    const user = getCurrentUser();
    const avatar = document.getElementById("profileAvatar");
    fillAvatar(avatar, user ? readAvatarCache() : "");
    avatar.disabled = !user;
    avatar.setAttribute("aria-label", user ? "프로필 사진 바꾸기" : "프로필 사진");
    document.getElementById("profileName").textContent = user || "로그인 안 됨";
    document.getElementById("profileAction").textContent = user ? "로그아웃" : "로그인";
    if (user) refreshMyAvatar();
  }

  // 저장된 내 프로필 사진 경로를 Supabase에서 다시 확인
  async function refreshMyAvatar() {
    const user = getCurrentUser();
    try {
      const res = await fetch(`${PROFILE_DB.url}/rest/v1/profiles?select=avatar_path&id=eq.${encodeURIComponent(user)}`, {
        headers: { apikey: PROFILE_DB.key }
      });
      if (!res.ok) return;
      const rows = await res.json();
      const path = rows.length ? rows[0].avatar_path : "";
      if (path !== readAvatarCache()) {
        writeAvatarCache(path);
        fillAvatar(document.getElementById("profileAvatar"), path);
      }
    } catch (e) { /* 인터넷이 안 되면 기억해 둔 사진 그대로 */ }
  }

  // 내 프로필 사진 저장 (path가 ""이면 기본 이미지)
  async function saveMyAvatar(path) {
    const res = await fetch(`${PROFILE_DB.url}/rest/v1/profiles?on_conflict=id`, {
      method: "POST",
      headers: {
        apikey: PROFILE_DB.key,
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=representation"
      },
      body: JSON.stringify({ id: getCurrentUser(), avatar_path: path, updated_at: new Date().toISOString() })
    });
    if (!res.ok) throw new Error(`프로필 저장 실패 (${res.status})`);
  }

  // 사진을 가운데 기준 정사각형 400px JPEG로 잘라서 올림
  async function uploadAvatar(file) {
    const url = URL.createObjectURL(file);
    let blob;
    try {
      const img = await new Promise((resolve, reject) => {
        const el = new Image();
        el.onload = () => resolve(el);
        el.onerror = () => reject(new Error("사진을 읽지 못했어요"));
        el.src = url;
      });
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 400;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, 400, 400);
      ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 400, 400);
      blob = await new Promise((resolve, reject) => {
        canvas.toBlob(b => b ? resolve(b) : reject(new Error("사진 변환 실패")), "image/jpeg", 0.88);
      });
    } finally {
      URL.revokeObjectURL(url);
    }

    const name = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
    const path = `${name}.jpg`;
    const res = await fetch(`${PROFILE_DB.url}/storage/v1/object/avatars/${path}`, {
      method: "POST",
      headers: { apikey: PROFILE_DB.key, "Content-Type": "image/jpeg" },
      body: blob
    });
    if (!res.ok) throw new Error(`사진 올리기 실패 (${res.status})`);
    return path;
  }

  function removeAvatarFile(path) {
    if (!path) return;
    fetch(`${PROFILE_DB.url}/storage/v1/object/avatars/${path}`, {
      method: "DELETE",
      headers: { apikey: PROFILE_DB.key }
    }).catch(() => {});
  }

  // 프로필 사진을 누르면: 사진 변경 / 기본 이미지로
  const profileMenu = document.getElementById("profileMenu");
  const avatarInput = document.getElementById("avatarInput");
  const profileNote = document.getElementById("profileNote");

  function showProfileNote(text) {
    profileNote.textContent = text;
    profileNote.classList.toggle("hidden", !text);
  }

  document.getElementById("profileAvatar").addEventListener("click", function(event) {
    event.stopPropagation();
    if (!getCurrentUser()) return;
    profileMenu.classList.toggle("hidden");
  });

  document.addEventListener("click", function(event) {
    if (!event.target.closest("#profileMenu")) profileMenu.classList.add("hidden");
  });

  document.getElementById("avatarChange").addEventListener("click", function() {
    profileMenu.classList.add("hidden");
    avatarInput.click();
  });

  avatarInput.addEventListener("change", async function() {
    const file = avatarInput.files[0];
    avatarInput.value = "";
    if (!file) return;

    const oldPath = readAvatarCache();
    showProfileNote("사진 올리는 중…");
    let newPath = null;
    try {
      newPath = await uploadAvatar(file);
      await saveMyAvatar(newPath);
      writeAvatarCache(newPath);
      fillAvatar(document.getElementById("profileAvatar"), newPath);
      removeAvatarFile(oldPath);
      showProfileNote("");
    } catch (e) {
      console.error(e);
      removeAvatarFile(newPath);
      showProfileNote("사진을 바꾸지 못했어요");
    }
  });

  document.getElementById("avatarReset").addEventListener("click", async function() {
    profileMenu.classList.add("hidden");
    const oldPath = readAvatarCache();
    try {
      await saveMyAvatar("");
      writeAvatarCache("");
      fillAvatar(document.getElementById("profileAvatar"), "");
      removeAvatarFile(oldPath);
      showProfileNote("");
    } catch (e) {
      console.error(e);
      showProfileNote("사진을 바꾸지 못했어요");
    }
  });

  // 로그아웃: 저장된 ID를 지우고 로그인 화면으로 / 로그인 안 됐으면 로그인 화면으로
  document.getElementById("profileAction").addEventListener("click", function() {
    try {
      localStorage.removeItem(USER_KEY);
    } catch (e) { /* 무시 */ }
    window.location.href = "index.html";
  });

  renderProfile();

  // 메뉴 버튼이 아닌 다른 곳을 누르면 박스가 사라짐
  document.addEventListener("pointerdown", function(event) {
    if (!event.target.closest(".sidebar-link")) {
      sidebarLinks.forEach(link => link.classList.remove("active"));
    }
  });

  // 이미 로그인한 ID가 저장돼 있으면 바로 로그인 후 화면
  const savedUser = getCurrentUser();
  if (savedUser && allowedIDs.includes(savedUser)) {
    showLoggedIn(savedUser);
  }
</script>

</body>
</html>
