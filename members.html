<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --line: #2b2b2b;
    --input: #f4f4f4;
    --input-text: #171717;

    /* 이 페이지(흰 배경)용 색 */
    --page-bg: #ffffff;
    --page-text: #111111;
    --cell-select: #e2e2e2;
    --myeongjo: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", "바탕", serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    color: var(--page-text);
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    position: relative;
  }

  /* 상단 바: 흰색을 깔아서 스크롤해도 아래 내용과 겹치지 않게,
     팝업을 포함한 다른 모든 화면보다 위 레이어 */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: var(--page-bg);
    z-index: 1000;
  }

  /* 흰 배경이므로 MuteF 글씨는 검은색 (위치는 Home과 동일) */
  .site-title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    color: #000;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  /* ───── 사이드바: Home.html과 동일 ───── */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(280px, 82vw);
    height: 100vh;
    height: 100dvh;           /* 휴대폰: 주소창·하단바를 뺀 실제 보이는 높이 */
    background: #181818;
    border-right: 1px solid var(--line);
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 24px 18px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }

  .sidebar-link:hover {
    background: #222;
  }

  .sidebar-link.active {
    background: #222;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }

  .home-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
  }

  /* 사이드바: 메뉴는 위, 프로필은 맨 아래 */
  .sidebar {
    display: flex;
    flex-direction: column;
    overflow-y: auto;         /* 화면이 낮으면 사이드바 안에서 스크롤 */
  }

  .sidebar-profile {
    margin-top: auto;
    margin-bottom: 28px;      /* 맨 밑에 붙지 않게 조금 위로 */
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 12px 4px;
    border-top: 1px solid #2b2b2b;
    color: #f5f5f5;
  }

  .profile-avatar {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #555;
    border-radius: 50%;
    background: #262626;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 17px;
  }

  .profile-info {
    min-width: 0;
  }

  .profile-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
  }

  .profile-action {
    margin-top: 3px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #a8a8a8;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .profile-action:hover {
    color: #f5f5f5;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-button {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 42px;
    height: 42px;
    padding: 8px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 10;
  }

  /* 흰 배경이므로 햄버거 버튼은 검은색 */
  .menu-button span {
    display: block;
    width: 24px;
    height: 2px;
    margin: 5px auto;
    background: #000;
    border-radius: 2px;
  }

  @media (max-width: 480px) {
    .menu-button {
      top: 12px;
      left: 12px;
    }
  }
  /* ───── 사이드바 끝 ───── */

  .hidden {
    display: none !important;
  }

  main {
    padding: 84px 16px 110px;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .view {
    width: min(560px, 100%);
    margin: 0 auto;
  }

  .sans {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }

  .load-note {
    min-height: 20px;
    margin: 14px 0 0;
    text-align: center;
    font-size: 14px;
    color: #777;
  }

  /* ───── 1. 멤버 목록: 각자 대표(또는 최근) 게시물 사진 + 제목 ───── */
  .member-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .member-card {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;     /* 가로가 더 긴 4:3 */
    padding: 0;
    border: 1px solid #d6d6d6;
    border-radius: 12px;
    overflow: hidden;
    background: #f1f1f1;
    color: #111;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 지금 로그인한 ID 카드 */
  .member-card.me {
    border: 2px solid #000;
  }

  .card-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 사진 위 글씨가 잘 보이도록 아래쪽만 살짝 어둡게 */
  .card-shade {
    position: absolute;
    inset: 45% 0 0 0;
    background: linear-gradient(transparent, rgba(0,0,0,.6));
  }

  .card-name {
    position: absolute;
    top: 8px;
    left: 8px;
    max-width: calc(100% - 16px);
    padding: 3px 8px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #000;
    font-size: 13px;
    font-weight: 700;
  }

  .card-title {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 8px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }

  /* 사진이 없을 때: 회색 칸에 검은 글씨 */
  .no-photo .card-title {
    color: #111;
  }

  .card-empty .card-title {
    color: #999;
    font-weight: 400;
  }

  /* ───── 공통: 뒤로가기 + 제목 줄 ───── */
  .view-head {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    margin-bottom: 14px;
  }

  .view-head h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: var(--myeongjo);
    font-size: 22px;
    font-weight: 700;
  }

  .back-button {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
  }

  .back-button:hover {
    background: #f0f0f0;
  }

  /* ───── 2. 게시물 목록 (트위터처럼 한 줄씩) ───── */
  .tweet-list {
    border-top: 1px solid #e6e6e6;
  }

  .tweet {
    position: relative;
    display: flex;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid #e6e6e6;
  }

  .tweet-avatar {
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #000;
    color: #fff;
    font-size: 17px;
  }

  .tweet-body {
    flex: 1;
    min-width: 0;
    display: block;
    padding: 0;
    border: 0;
    background: transparent;
    color: #111;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .tweet-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 22px;
    padding-right: 34px;      /* ⋮ 버튼 자리 */
    font-size: 15px;
  }

  .tweet-name {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-weight: 700;
  }

  .tweet-time {
    flex: 0 0 auto;
    color: #888;
    white-space: nowrap;
  }

  .tweet-time::before {
    content: "· ";
  }

  .tweet-pin {
    flex: 0 0 auto;
    padding: 2px 7px;
    border-radius: 999px;
    background: #000;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .tweet-title {
    margin-top: 4px;
    font-size: 15px;
    line-height: 1.45;
    word-break: break-all;
  }

  .tweet-photo {
    display: block;
    width: 100%;
    max-height: 420px;
    margin-top: 10px;
    object-fit: cover;
    border: 1px solid #e6e6e6;
    border-radius: 14px;
    background: #f1f1f1;
  }

  .empty-note {
    margin: 40px 0 0;
    text-align: center;
    font-size: 15px;
    color: #888;
  }

  /* 세로 점 3개 메뉴 — 게시물 오른쪽 위 */
  .kebab {
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 2;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    color: #000;
    cursor: pointer;
  }

  .kebab svg {
    width: 18px;
    height: 18px;
  }

  .tweet .kebab {
    top: 8px;
    right: 0;
    background: transparent;
  }

  .tweet .kebab:hover {
    background: #f0f0f0;
  }

  .view-head .kebab {
    position: static;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    background: transparent;
  }

  .view-head .kebab:hover {
    background: #f0f0f0;
  }

  .post-menu {
    position: absolute;
    top: 40px;
    right: 6px;
    z-index: 3;
    min-width: 108px;
    padding: 4px;
    border: 1px solid #000;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,.15);
  }

  .view-head .post-menu {
    top: 44px;
    right: 0;
  }

  .post-menu button {
    display: block;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #000;
    font-family: var(--myeongjo);
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }

  .post-menu button:hover {
    background: #f0f0f0;
  }

  .post-menu .danger {
    color: #c62828;
  }

  /* 내 피드에서만: 오른쪽 아래 동그라미 + 버튼 */
  .fab {
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 50;
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #000;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
    cursor: pointer;
  }

  /* + 는 글자 대신 가로·세로 막대 두 개로 그려서 동그라미 정중앙에 맞춤 */
  .fab::before,
  .fab::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 3px;
    border-radius: 2px;
    background: #fff;
    transform: translate(-50%, -50%);
  }

  .fab::after {
    transform: translate(-50%, -50%) rotate(90deg);
  }

  /* ───── 3. 게시물 (하나의 화면) ───── */
  .post-photo {
    display: block;
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 12px;
    background: #f1f1f1;
  }

  .post-time {
    margin: 8px 2px 0;
    font-size: 14px;
    color: #888;
  }

  .post-title {
    margin: 16px 2px 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    word-break: break-all;
  }

  /* ───── 4. 게시물 작성/수정 ───── */
  .photo-picker {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 1px dashed #000;
    border-radius: 12px;
    overflow: hidden;
    background: #fafafa;
    cursor: pointer;
  }

  .photo-picker img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-hint {
    font-family: var(--myeongjo);
    font-size: 16px;
    font-weight: 700;
    color: #555;
  }

  .photo-change {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: 13px;
  }

  .title-input {
    display: block;
    width: 100%;
    height: 48px;
    margin-top: 14px;
    padding: 0 14px;
    border: 1px solid #cfcfcf;
    border-radius: 8px;
    background: #fafafa;
    color: #111;
    font-size: 16px;
    outline: none;
  }

  .title-input:focus {
    border-color: #000;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .form-actions button,
  .confirm-actions button {
    flex: 1;
    height: 46px;
    border: 1px solid #000;
    border-radius: 6px;
    background: #fff;
    color: #000;
    font-family: var(--myeongjo);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .form-actions .primary,
  .confirm-actions .primary {
    background: #000;
    color: #fff;
  }

  .form-actions button:disabled,
  .confirm-actions button:disabled {
    opacity: .55;
    cursor: default;
  }

  /* ───── 삭제 확인 팝업 ───── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 84px 16px 16px;
    background: rgba(0, 0, 0, 0.45);
  }

  .confirm-box {
    width: min(340px, 100%);
    padding: 22px 16px 16px;
    border: 3px solid #000;
    border-radius: 18px;
    background: #fff;
  }

  .confirm-box p {
    margin: 0 0 6px;
    text-align: center;
    font-family: var(--myeongjo);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    word-break: keep-all;
  }

  .confirm-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  /* ───── 안내 알림 (공유 링크 복사 등) ───── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    z-index: 300;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 999px;
    background: #000;
    color: #fff;
    font-size: 14px;
    white-space: nowrap;
  }
</style>
</head>

<body>
  <header class="site-header">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">×</button>

      <nav class="sidebar-nav">
        <button class="sidebar-link" type="button" data-href="Home.html">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.2Z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linejoin="round"/>
          </svg>
          <span>Home</span>
        </button>
        <button class="sidebar-link" type="button" data-href="calender.html">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="1.5"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.5 9.8h17M8 3v4M16 3v4"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
          </svg>
          <span>Schedule</span>
        </button>
        <button class="sidebar-link" type="button" data-href="members.html">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="8" r="3.2"
                    fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.5 19.5c0-3.2 2.5-5.6 5.5-5.6s5.5 2.4 5.5 5.6M16.3 5.6a2.8 2.8 0 0 1 0 5.4M17 14.1c2.1.5 3.5 2.6 3.5 5.4"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
          </svg>
          <span>Members</span>
        </button>
        <button class="sidebar-link" type="button" data-href="timeline.html">
          <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"
                    fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 7.5V12l3 2"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Timeline</span>
        </button>
      </nav>

      <!-- 로그인한 ID 프로필 (사이드바 맨 아래) -->
      <div class="sidebar-profile">
        <div class="profile-avatar" id="profileAvatar" aria-hidden="true"></div>
        <div class="profile-info">
          <div class="profile-name" id="profileName"></div>
          <button class="profile-action" id="profileAction" type="button"></button>
        </div>
      </div>
    </aside>

    <button class="menu-button" type="button" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="site-title">MuteF</div>
  </header>

  <main class="sans">
    <!-- 1. 멤버 목록 -->
    <section class="view" id="listView">
      <ul class="member-grid" id="memberGrid"></ul>
      <p class="load-note" id="listNote" aria-live="polite"></p>
    </section>

    <!-- 2. 멤버별 피드 -->
    <section class="view hidden" id="feedView">
      <div class="view-head">
        <button class="back-button" id="feedBack" type="button" aria-label="뒤로">&lsaquo;</button>
        <h1 id="feedTitle"></h1>
      </div>
      <div class="tweet-list" id="postGrid"></div>
      <p class="empty-note hidden" id="feedEmpty"></p>
    </section>

    <!-- 3. 게시물 하나 (팝업이 아닌 하나의 화면) -->
    <section class="view hidden" id="postView">
      <div class="view-head" id="postHead">
        <button class="back-button" id="postBack" type="button" aria-label="뒤로">&lsaquo;</button>
        <h1 id="postAuthor"></h1>
      </div>
      <img class="post-photo hidden" id="postPhoto" alt="">
      <h2 class="post-title" id="postTitle"></h2>
      <p class="post-time" id="postTime"></p>
      <!-- 여기에 넣을 내용은 나중에 추가 -->
    </section>

    <!-- 4. 게시물 작성 / 수정 -->
    <section class="view hidden" id="formView">
      <div class="view-head">
        <button class="back-button" id="formBack" type="button" aria-label="뒤로">&lsaquo;</button>
        <h1 id="formHeading">게시물 작성</h1>
      </div>

      <label class="photo-picker" id="photoPicker">
        <input type="file" id="photoInput" accept="image/*" hidden>
        <img id="photoPreview" class="hidden" alt="">
        <span class="photo-hint" id="photoHint">+ 사진 추가</span>
        <span class="photo-change hidden" id="photoChange">사진 바꾸기</span>
      </label>

      <input class="title-input" id="titleInput" type="text" placeholder="제목" maxlength="100" autocomplete="off">

      <div class="form-actions">
        <button type="button" id="formCancel">취소</button>
        <button type="button" class="primary" id="formSave">저장</button>
      </div>
      <p class="load-note" id="formNote" aria-live="polite"></p>
    </section>
  </main>

  <!-- 내 피드에서만 보이는 게시물 올리기 버튼 -->
  <button class="fab hidden" id="fab" type="button" aria-label="게시물 올리기"></button>

  <!-- 삭제 확인 팝업 -->
  <div class="modal-backdrop hidden" id="confirmModal">
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
      <p id="confirmText"></p>
      <p class="load-note" id="confirmNote" aria-live="polite"></p>
      <div class="confirm-actions">
        <button type="button" id="confirmNo">아니요</button>
        <button type="button" class="primary" id="confirmYes">네</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>

  <script>
    /* ───── 사이드바 ───── */
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    document.querySelector(".menu-button").addEventListener("click", openSidebar);
    document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // 사이드바 메뉴: 누르면 박스 표시 후 해당 파일로 이동
    // 파일 이름이나 위치가 바뀌면 각 버튼의 data-href만 수정하면 됩니다.
    const sidebarLinks = document.querySelectorAll(".sidebar-link");

    sidebarLinks.forEach(function(link) {
      link.addEventListener("click", function() {
        link.classList.add("active");
        window.location.href = link.dataset.href;
      });
    });

    // ───── 사이드바 아래 프로필: index.html에서 로그인한 ID ─────
    // (이 브라우저에 저장된 값이라 진짜 보안 로그인은 아님)
    const USER_KEY = "mutef-user";

    function getCurrentUser() {
      try {
        return localStorage.getItem(USER_KEY);
      } catch (e) {
        return null;
      }
    }

    function renderProfile() {
      const user = getCurrentUser();
      document.getElementById("profileAvatar").textContent = user ? user.charAt(0).toUpperCase() : "?";
      document.getElementById("profileName").textContent = user || "로그인 안 됨";
      document.getElementById("profileAction").textContent = user ? "로그아웃" : "로그인";
    }

    // 로그아웃: 저장된 ID를 지우고 로그인 화면으로 / 로그인 안 됐으면 로그인 화면으로
    document.getElementById("profileAction").addEventListener("click", function() {
      try {
        localStorage.removeItem(USER_KEY);
      } catch (e) { /* 무시 */ }
      window.location.href = "index.html";
    });

    renderProfile();

    // 메뉴 버튼이 아닌 다른 곳을 누르면 박스가 사라짐
    document.addEventListener("pointerdown", function(event) {
      if (!event.target.closest(".sidebar-link")) {
        sidebarLinks.forEach(link => link.classList.remove("active"));
      }
    });

    /* ───── 멤버 ───── */
    // index.html의 아이디 목록에서 관리자(echae)·테스트용(friend1, friend2)을 뺀 것
    const MEMBERS = [
      "권은서",
      "정수인",
      "김서현",
      "이선우",
      "김현재",
      "한경원",
      "한지후"
    ];

    const me = getCurrentUser();
    const PAGE = "members";   // members: 피드 / timeline: 타임라인

    /* ───── 게시물 저장소 (Supabase: posts 표 + post-images 사진 보관함) ───── */
    // 공개용(publishable) 키라 html에 들어가도 되는 값. 접근 규칙은 supabase/migrations/ 의 SQL에서 관리
    const SUPABASE_URL = "https://xbvormcnoexpxtjoioko.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WUlX-m46GveYJsrJ837LsQ_732EGb8R";
    const POSTS_API = `${SUPABASE_URL}/rest/v1/posts`;
    const BUCKET = "post-images";

    const WRITE_HEADERS = {
      apikey: SUPABASE_KEY,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    };

    let posts = [];          // 최신 글이 앞
    let postsLoaded = false;

    function imageUrl(path) {
      return path ? `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}` : "";
    }

    async function fetchPosts() {
      const res = await fetch(`${POSTS_API}?select=*&order=created_at.desc`, {
        headers: { apikey: SUPABASE_KEY }
      });
      if (!res.ok) throw new Error(`불러오기 실패 (${res.status})`);
      return res.json();
    }

    async function insertPost(row) {
      const res = await fetch(POSTS_API, {
        method: "POST",
        headers: WRITE_HEADERS,
        body: JSON.stringify(row)
      });
      if (!res.ok) throw new Error(`저장 실패 (${res.status})`);
      return (await res.json())[0];
    }

    // 조건(query)에 맞는 게시물 고치기 — 바뀐 행들을 돌려받음
    async function patchPosts(query, fields) {
      const res = await fetch(`${POSTS_API}?${query}`, {
        method: "PATCH",
        headers: WRITE_HEADERS,
        body: JSON.stringify(fields)
      });
      if (!res.ok) throw new Error(`수정 실패 (${res.status})`);
      return res.json();
    }

    async function deletePostRow(id) {
      const res = await fetch(`${POSTS_API}?id=eq.${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: WRITE_HEADERS
      });
      const rows = res.ok ? await res.json() : [];
      if (!rows.length) throw new Error(`삭제 실패 (${res.status})`);
    }

    function randomName() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    async function uploadImage(blob) {
      const path = `${randomName()}.jpg`;
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "image/jpeg" },
        body: blob
      });
      if (!res.ok) throw new Error(`사진 올리기 실패 (${res.status})`);
      return path;
    }

    // 사진 지우기 — 실패해도 게시물에는 영향 없으니 무시
    function removeImage(path) {
      if (!path) return;
      fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: "DELETE",
        headers: { apikey: SUPABASE_KEY }
      }).catch(() => {});
    }

    // 휴대폰 사진은 커서 긴 변 1600px JPEG로 줄여서 올림
    async function resizeImage(file, max = 1600) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const el = new Image();
          el.onload = () => resolve(el);
          el.onerror = () => reject(new Error("사진을 읽지 못했어요"));
          el.src = url;
        });
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";               // 투명 PNG의 배경
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve, reject) => {
          canvas.toBlob(b => b ? resolve(b) : reject(new Error("사진 변환 실패")), "image/jpeg", 0.85);
        });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    // 화면에 보이는 이름: 자기 ID면 "나"
    function displayName(name) {
      return name === me ? "나" : name;
    }

    // 피드 게시물 (타임라인에 바로 올린 글은 피드에 안 보임)
    function postsOf(name) {
      return posts.filter(p => p.author === name && p.source !== "timeline");
    }

    // 대표로 지정한 게시물이 먼저, 없으면 최근 순
    function sortedPostsOf(name) {
      const list = postsOf(name);
      return [...list.filter(p => p.pinned), ...list.filter(p => !p.pinned)];
    }

    function findPost(id) {
      return posts.find(p => p.id === id);
    }

    /* ───── 게시물 한 줄 (트위터 형식) — 피드와 타임라인 공통 ───── */
    function photoEl(path, className) {
      const img = document.createElement("img");
      img.className = className;
      img.src = imageUrl(path);
      img.alt = "";
      img.loading = "lazy";
      return img;
    }

    function textEl(tag, className, text) {
      const el = document.createElement(tag);
      el.className = className;
      el.textContent = text;
      return el;
    }

    // 얼마 전에 올라왔는지: 분 → 시간 → 일(30일까지) → 개월 → 년
    function timeAgo(iso) {
      const minutes = Math.floor(Math.max(0, Date.now() - new Date(iso).getTime()) / 60000);
      if (minutes < 1) return "방금 전";
      if (minutes < 60) return `${minutes}분 전`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}시간 전`;
      const days = Math.floor(hours / 24);
      if (days <= 30) return `${days}일 전`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months}개월 전`;
      return `${Math.max(1, Math.floor(days / 365))}년 전`;
    }

    function tweetEl(post) {
      const item = document.createElement("article");
      item.className = "tweet";

      const avatar = textEl("div", "tweet-avatar", post.author.charAt(0).toUpperCase());
      avatar.setAttribute("aria-hidden", "true");

      const head = document.createElement("div");
      head.className = "tweet-head";
      head.append(
        textEl("span", "tweet-name", displayName(post.author)),
        textEl("span", "tweet-time", timeAgo(post.created_at))
      );
      if (PAGE === "members" && post.pinned) head.appendChild(textEl("span", "tweet-pin", "대표"));

      const body = document.createElement("button");
      body.type = "button";
      body.className = "tweet-body";
      body.append(head, textEl("div", "tweet-title", post.title));
      if (post.image_path) body.appendChild(photoEl(post.image_path, "tweet-photo"));
      body.addEventListener("click", () => navigate(`post/${post.id}`));

      item.append(avatar, body, ...menuFor(post));
      return item;
    }

    /* ───── 화면 전환 (같은 html, 주소의 #으로 구분) ─────
       ""            멤버 목록
       feed/이름     멤버별 피드
       post/id       게시물 하나
       new           게시물 작성 (내 피드)
       edit/id       게시물 수정 (내 게시물) */
    const views = {
      list: document.getElementById("listView"),
      feed: document.getElementById("feedView"),
      post: document.getElementById("postView"),
      form: document.getElementById("formView")
    };
    const fab = document.getElementById("fab");
    const NEW_POST_SOURCE = "feed";   // 피드에 올린 글 — 타임라인에도 자동으로 보임

    // 게시물을 다 보고 돌아갈 화면: 그 사람의 피드
    function listRoute(author) {
      return `feed/${author}`;
    }

    let currentRoute = readHash();

    function readHash() {
      try {
        return decodeURIComponent(location.hash.slice(1));
      } catch (e) {
        return "";
      }
    }

    function navigate(route) {
      currentRoute = route;
      try {
        if (readHash() !== route) location.hash = encodeURIComponent(route).replace(/%2F/g, "/");
      } catch (e) { /* 주소를 못 바꾸는 환경 — 무시 */ }
      render();
    }

    // 뒤로가기·앞으로가기로 주소가 바뀌었을 때만 다시 그림
    // (navigate()로 바꾼 주소는 이미 그렸으니 다시 그리면 입력하던 내용이 지워짐)
    window.addEventListener("hashchange", function() {
      if (readHash() === currentRoute) return;
      currentRoute = readHash();
      render();
    });

    function showView(name) {
      Object.entries(views).forEach(([key, el]) => el.classList.toggle("hidden", key !== name));
      window.scrollTo(0, 0);
    }

    function render() {
      closeMenus();
      fab.classList.add("hidden");
      const [kind, ...rest] = currentRoute.split("/");
      const arg = rest.join("/");

      if (kind === "feed" && MEMBERS.includes(arg)) return renderFeed(arg);

      if (kind === "post" || kind === "edit") {
        const post = findPost(arg);
        if (!post) {
          if (postsLoaded) return navigate("");
          return renderList();      // 아직 불러오는 중 — 불러온 뒤 다시 그림
        }
        if (kind === "post") return renderPost(post);
        if (post.author === me) return renderForm(post);
        return navigate(`post/${post.id}`);
      }

      if (kind === "new") {
        if (me && MEMBERS.includes(me)) return renderForm(null);
        return navigate("");
      }

      renderList();
    }

    /* ───── 1. 멤버 목록 ───── */
    const memberGrid = document.getElementById("memberGrid");
    const listNote = document.getElementById("listNote");

    function renderList() {
      showView("list");
      memberGrid.innerHTML = "";

      MEMBERS.forEach(function(name) {
        const cover = sortedPostsOf(name)[0];   // 대표 게시물, 없으면 최근 게시물

        const card = document.createElement("button");
        card.type = "button";
        card.className = "member-card";
        if (name === me) card.classList.add("me");
        card.setAttribute("aria-label", `${displayName(name)}의 피드`);

        if (cover && cover.image_path) {
          card.append(photoEl(cover.image_path, "card-photo"), textEl("span", "card-shade", ""));
        } else {
          card.classList.add("no-photo");
        }
        if (!cover) card.classList.add("card-empty");

        card.append(
          textEl("span", "card-name", displayName(name)),
          textEl("span", "card-title", cover ? cover.title : (postsLoaded ? "아직 게시물이 없어요" : ""))
        );

        card.addEventListener("click", () => navigate(`feed/${name}`));

        const li = document.createElement("li");
        li.appendChild(card);
        memberGrid.appendChild(li);
      });
    }

    /* ───── 2. 멤버별 피드 ───── */
    const postGrid = document.getElementById("postGrid");
    const feedEmpty = document.getElementById("feedEmpty");

    function renderFeed(name) {
      showView("feed");
      document.getElementById("feedTitle").textContent = displayName(name);
      postGrid.innerHTML = "";

      const list = sortedPostsOf(name);
      list.forEach(post => postGrid.appendChild(tweetEl(post)));

      feedEmpty.classList.toggle("hidden", list.length > 0);
      feedEmpty.textContent = !postsLoaded ? "불러오는 중…"
        : name === me ? "오른쪽 아래 + 를 눌러 첫 게시물을 올려 보세요."
        : "아직 게시물이 없어요.";

      // 내 피드에서만 + 버튼
      fab.classList.toggle("hidden", name !== me);
    }

    fab.addEventListener("click", () => navigate("new"));
    document.getElementById("feedBack").addEventListener("click", () => navigate(""));

    /* ───── 게시물 ⋮ 메뉴: 남의 것은 공유만 / 내 것은 수정·삭제·대표 지정·공유 ───── */
    const KEBAB_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="5" r="1.9" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.9" fill="currentColor"/>
      <circle cx="12" cy="19" r="1.9" fill="currentColor"/>
    </svg>`;

    function menuFor(post) {
      const kebab = document.createElement("button");
      kebab.type = "button";
      kebab.className = "kebab";
      kebab.setAttribute("aria-label", "게시물 메뉴");
      kebab.setAttribute("aria-expanded", "false");
      kebab.innerHTML = KEBAB_ICON;

      const menu = document.createElement("div");
      menu.className = "post-menu hidden";

      // 대표 지정은 피드(members)에서 피드 게시물만
      const canPin = PAGE === "members" && post.source !== "timeline";
      const items = post.author === me
        ? [["edit", "수정"], ["delete", "삭제"],
           ...(canPin ? [["pin", post.pinned ? "대표 해제" : "대표로 지정"]] : []),
           ["share", "공유"]]
        : [["share", "공유"]];

      items.forEach(function([action, label]) {
        const item = document.createElement("button");
        item.type = "button";
        item.textContent = label;
        if (action === "delete") item.className = "danger";
        item.addEventListener("click", function(event) {
          event.stopPropagation();
          closeMenus();
          if (action === "edit") navigate(`edit/${post.id}`);
          if (action === "delete") askDelete(post);
          if (action === "pin") togglePin(post);
          if (action === "share") sharePost(post);
        });
        menu.appendChild(item);
      });

      kebab.addEventListener("click", function(event) {
        event.stopPropagation();
        const willOpen = menu.classList.contains("hidden");
        closeMenus();
        menu.classList.toggle("hidden", !willOpen);
        kebab.setAttribute("aria-expanded", String(willOpen));
      });

      return [kebab, menu];
    }

    function closeMenus() {
      document.querySelectorAll(".post-menu").forEach(m => m.classList.add("hidden"));
      document.querySelectorAll(".kebab").forEach(k => k.setAttribute("aria-expanded", "false"));
    }

    document.addEventListener("click", function(event) {
      if (!event.target.closest(".post-menu")) closeMenus();
    });

    // 대표 지정: 내 다른 대표는 해제하고 이 게시물을 대표로
    async function togglePin(post) {
      try {
        if (post.pinned) {
          await patchPosts(`id=eq.${encodeURIComponent(post.id)}`, { pinned: false });
          post.pinned = false;
          showToast("대표를 해제했어요");
        } else {
          await patchPosts(`author=eq.${encodeURIComponent(me)}&pinned=eq.true`, { pinned: false });
          const rows = await patchPosts(`id=eq.${encodeURIComponent(post.id)}`, { pinned: true });
          if (!rows.length) throw new Error("대표 지정 실패");
          postsOf(me).forEach(p => { p.pinned = p.id === post.id; });
          showToast("대표 게시물로 지정했어요");
        }
      } catch (e) {
        console.error(e);
        showToast("바꾸지 못했어요. 다시 해 주세요");
      }
      render();
    }

    // 공유: 휴대폰은 공유 창, 안 되면 링크 복사
    async function sharePost(post) {
      const url = `${location.origin}${location.pathname}#post/${post.id}`;
      if (navigator.share) {
        try {
          await navigator.share({ title: post.title || "MuteF", url });
          return;
        } catch (e) {
          if (e.name === "AbortError") return;   // 사용자가 공유 창을 닫음
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast("링크를 복사했어요");
      } catch (e) {
        window.prompt("이 링크를 복사하세요", url);
      }
    }

    const toast = document.getElementById("toast");
    let toastTimer = null;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 2000);
    }

    /* ───── 3. 게시물 하나 ───── */
    const postHead = document.getElementById("postHead");
    const postPhoto = document.getElementById("postPhoto");

    function renderPost(post) {
      showView("post");
      document.getElementById("postAuthor").textContent = displayName(post.author);
      document.getElementById("postTitle").textContent = post.title;
      document.getElementById("postTime").textContent = timeAgo(post.created_at);

      postPhoto.classList.toggle("hidden", !post.image_path);
      postPhoto.src = imageUrl(post.image_path);

      postHead.querySelectorAll(".kebab, .post-menu").forEach(el => el.remove());
      postHead.append(...menuFor(post));
    }

    document.getElementById("postBack").addEventListener("click", function() {
      const post = findPost(currentRoute.split("/")[1]);
      navigate(post ? listRoute(post.author) : "");
    });

    /* ───── 4. 게시물 작성 / 수정 (처음 작성 화면과 같은 화면) ───── */
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const photoHint = document.getElementById("photoHint");
    const photoChange = document.getElementById("photoChange");
    const titleInput = document.getElementById("titleInput");
    const formNote = document.getElementById("formNote");
    const formSave = document.getElementById("formSave");

    let editingPost = null;   // 수정 중인 게시물 (새 글이면 null)
    let pickedFile = null;    // 새로 고른 사진
    let previewUrl = null;
    let saving = false;

    function setPreview(src) {
      photoPreview.classList.toggle("hidden", !src);
      photoHint.classList.toggle("hidden", !!src);
      photoChange.classList.toggle("hidden", !src);
      if (src) photoPreview.src = src;
      else photoPreview.removeAttribute("src");
    }

    function renderForm(post) {
      showView("form");
      editingPost = post;
      pickedFile = null;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      photoInput.value = "";

      document.getElementById("formHeading").textContent = post ? "게시물 수정" : "게시물 작성";
      titleInput.value = post ? post.title : "";
      setPreview(post && post.image_path ? imageUrl(post.image_path) : "");
      formNote.textContent = "";
    }

    photoInput.addEventListener("change", function() {
      const file = photoInput.files[0];
      if (!file) return;
      pickedFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      setPreview(previewUrl);
    });

    function leaveForm() {
      navigate(editingPost ? `post/${editingPost.id}` : listRoute(me));
    }

    document.getElementById("formBack").addEventListener("click", leaveForm);
    document.getElementById("formCancel").addEventListener("click", leaveForm);

    formSave.addEventListener("click", async function() {
      if (saving) return;

      const title = titleInput.value.trim();
      if (!title) {
        formNote.textContent = "제목을 입력해 주세요.";
        titleInput.focus();
        return;
      }

      saving = true;
      formSave.disabled = true;
      formSave.textContent = "저장 중…";
      formNote.textContent = "";

      let newPath = null;
      try {
        if (pickedFile) newPath = await uploadImage(await resizeImage(pickedFile));

        if (editingPost) {
          const fields = { title };
          if (newPath) fields.image_path = newPath;
          const rows = await patchPosts(`id=eq.${encodeURIComponent(editingPost.id)}`, fields);
          if (!rows.length) throw new Error("수정 실패");
          if (newPath) removeImage(editingPost.image_path);   // 바꾸기 전 사진은 지움
          Object.assign(editingPost, rows[0]);
          navigate(`post/${editingPost.id}`);
        } else {
          const row = await insertPost({ author: me, title, image_path: newPath || "", source: NEW_POST_SOURCE });
          posts.unshift(row);
          navigate(listRoute(me));
        }
      } catch (e) {
        console.error(e);
        if (newPath) removeImage(newPath);
        formNote.textContent = "저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
      } finally {
        saving = false;
        formSave.disabled = false;
        formSave.textContent = "저장";
      }
    });

    /* ───── 삭제 확인 팝업 ───── */
    const confirmModal = document.getElementById("confirmModal");
    const confirmNote = document.getElementById("confirmNote");
    const confirmYes = document.getElementById("confirmYes");
    let deleteTarget = null;
    let deleting = false;

    function askDelete(post) {
      deleteTarget = post;
      document.getElementById("confirmText").textContent =
        `정말 '${post.title || "이"}' 게시물을 삭제할까요?`;
      confirmNote.textContent = "";
      confirmModal.classList.remove("hidden");
    }

    function closeConfirm() {
      if (deleting) return;
      deleteTarget = null;
      confirmModal.classList.add("hidden");
    }

    document.getElementById("confirmNo").addEventListener("click", closeConfirm);
    confirmModal.addEventListener("click", function(event) {
      if (event.target === confirmModal) closeConfirm();
    });

    confirmYes.addEventListener("click", async function() {
      if (!deleteTarget || deleting) return;
      deleting = true;
      confirmYes.disabled = true;
      confirmYes.textContent = "삭제 중…";

      const post = deleteTarget;
      try {
        await deletePostRow(post.id);
      } catch (e) {
        console.error(e);
        confirmNote.textContent = "삭제하지 못했어요. 다시 눌러 주세요.";
        return;
      } finally {
        deleting = false;
        confirmYes.disabled = false;
        confirmYes.textContent = "네";
      }

      removeImage(post.image_path);
      posts = posts.filter(p => p.id !== post.id);
      closeConfirm();
      navigate(listRoute(post.author));
    });

    document.addEventListener("keydown", function(event) {
      if (event.key !== "Escape") return;
      if (!confirmModal.classList.contains("hidden")) closeConfirm();
      else closeMenus();
    });

    /* ───── 시작: 화면 그리고 게시물 불러오기 ───── */
    render();
    listNote.textContent = "불러오는 중…";

    fetchPosts()
      .then(function(rows) {
        posts = rows;
        postsLoaded = true;
        listNote.textContent = "";
        render();
      })
      .catch(function(e) {
        console.error(e);
        listNote.textContent = "게시물을 불러오지 못했어요. 새로고침해 주세요.";
      });
  </script>
</body>
</html>
