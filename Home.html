<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --bg: #121212;
    --text: #f5f5f5;
    --muted: #a8a8a8;
    --line: #2b2b2b;
    --input: #f4f4f4;
    --input-text: #171717;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #0d0d0d;
    color: #f5f5f5;
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* 상단 바: 배경을 깔아서, 내려오는 메뉴 창은 항상 이 바 밑에서 나옴 */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: #0d0d0d;
    z-index: 100;
  }

  .site-title {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    color: #fff;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  /* ───── 사이드바: friends_secret_site.html에서 그대로 복사 ───── */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(280px, 82vw);
    height: 100vh;
    height: 100dvh;           /* 휴대폰: 주소창·하단바를 뺀 실제 보이는 높이 */
    background: #181818;
    border-right: 1px solid var(--line);
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 24px 18px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }

  .sidebar-link:hover {
    background: #222;
  }

  .sidebar-link.active {
    background: #222;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }

  .home-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
  }

  /* 사이드바: 메뉴는 위, 프로필은 맨 아래 */
  .sidebar {
    display: flex;
    flex-direction: column;
    overflow-y: auto;         /* 화면이 낮으면 사이드바 안에서 스크롤 */
  }

  .sidebar-profile {
    margin-top: auto;
    margin-bottom: 28px;      /* 맨 밑에 붙지 않게 조금 위로 */
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 12px 4px;
    border-top: 1px solid #2b2b2b;
    color: #f5f5f5;
  }

  .sidebar-profile {
    position: relative;
  }

  .hidden {
    display: none !important;
  }

  /* 프로필 사진: 없으면 검은 바탕에 흰 흉상 (기본 이미지) */
  .avatar {
    display: block;
    overflow: hidden;
    border-radius: 50%;
    background: #000;
  }

  .avatar img,
  .avatar svg {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-avatar {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid #555;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .profile-avatar:disabled {
    cursor: default;
  }

  /* 프로필 사진을 누르면 뜨는 메뉴 */
  .profile-menu {
    position: absolute;
    left: 10px;
    bottom: calc(100% - 6px);
    z-index: 1;
    min-width: 140px;
    padding: 4px;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    background: #222;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }

  .profile-menu button {
    display: block;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }

  .profile-menu button:hover {
    background: #2e2e2e;
  }

  .profile-note {
    margin-top: 2px;
    color: #a8a8a8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 12px;
  }

  .profile-info {
    min-width: 0;
  }

  .profile-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
  }

  .profile-action {
    margin-top: 3px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #a8a8a8;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .profile-action:hover {
    color: #f5f5f5;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-button {
    position: fixed;
    top: 18px;
    left: 18px;
    width: 42px;
    height: 42px;
    padding: 8px;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 10;
  }

  .menu-button span {
    display: block;
    width: 24px;
    height: 2px;
    margin: 5px auto;
    background: var(--text);
    border-radius: 2px;
  }

  @media (max-width: 480px) {
  
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: min(280px, 82vw);
    height: 100vh;
    height: 100dvh;           /* 휴대폰: 주소창·하단바를 뺀 실제 보이는 높이 */
    background: #181818;
    border-right: 1px solid var(--line);
    z-index: 20;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 24px 18px;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
  }

  .sidebar-link:hover {
    background: #222;
  }

  .home-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
  }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-button {
      top: 12px;
      left: 12px;
    }

    h1 {
      margin-bottom: 28px;
    }
  }
  /* ───── 복사 끝 ───── */

  .home-page {
    position: fixed;
    inset: 0;
  }

  .turntable-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(79.5vw, 67.7vh);  /* LP = 스테이지의 75% → 사진과 같은 크기 비율 */
    aspect-ratio: 1;
  }

  /* LP */
  .record {
    position: absolute;
    /* 스테이지(정사각형)의 75% 크기를 정중앙에 배치.
       회전 애니메이션이 transform을 덮어쓰므로 translate 대신 inset으로 위치를 잡음 */
    left: 12.5%;
    top: 12.5%;
    width: 75%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #080808;
    box-shadow:
      0 22px 55px rgba(0,0,0,.65),
      inset 0 0 0 1px #303030;
    overflow: hidden;
    animation: spin 5s linear infinite;
  }

  /* LP 표면의 미세한 결 */
  .record::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-radial-gradient(
        circle at center,
        transparent 0 2.4px,
        rgba(255,255,255,.07) 3px,
        transparent 3.6px 6px
      );
    opacity: .7;
  }

  /* 회전하면서 움직이는 빛 */
  .record::after {
    content: "";
    position: absolute;
    width: 150%;
    height: 55%;
    left: -25%;
    top: -10%;
    border-radius: 50%;
    background: linear-gradient(
      115deg,
      transparent 0%,
      transparent 37%,
      rgba(255,255,255,.02) 43%,
      rgba(255,255,255,.20) 49%,
      rgba(255,255,255,.035) 54%,
      transparent 62%,
      transparent 100%
    );
    transform: rotate(-25deg);
    filter: blur(4px);
  }

  /* 반대쪽 빛 — 위 빛을 LP 중심점 기준으로 점대칭 (위치 반전 + 180° 회전) */
  .record .shine-mirror {
    position: absolute;
    width: 150%;
    height: 55%;
    left: -25%;
    bottom: -10%;
    border-radius: 50%;
    background: linear-gradient(
      115deg,
      transparent 0%,
      transparent 37%,
      rgba(255,255,255,.02) 43%,
      rgba(255,255,255,.20) 49%,
      rgba(255,255,255,.035) 54%,
      transparent 62%,
      transparent 100%
    );
    transform: rotate(155deg);
    filter: blur(4px);
    pointer-events: none;
  }

  /* ───── 상단 메뉴 창: 화살표를 누르면 상단 바 밑에서 쭉 내려옴 ───── */
  .drop-menu {
    position: fixed;
    z-index: 90;            /* 상단 바(100)보다 아래 */
    top: 68px;
    left: 0;
    right: 0;
    background: #141414;
    border-bottom: 1px solid #2b2b2b;
    transform: translateY(-100%);
    transition: transform 0.35s ease;
  }

  .drop-menu.open {
    transform: translateY(0);
    box-shadow: 0 14px 30px rgba(0,0,0,.55);
  }

  /* 메뉴는 세로로 3개씩, 넘치면 오른쪽 열로. 항목이 적어도 창은 3줄 높이 */
  .drop-list {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(3, 1.7em);
    grid-auto-columns: max-content;
    justify-content: start;   /* 왼쪽부터 배치 */
    align-items: center;
    row-gap: 0.5em;
    column-gap: 2em;
    margin: 0;
    padding: 22px 16px 26px 69px;   /* 햄버거 버튼 영역(왼쪽 60px)은 비워 둠 */
    list-style: none;
    font-family: "Galmuri11", "Galmuri9", monospace;
    font-size: 18px;
  }

  /* 열기/닫기 손잡이 — 창 아래 끝에 붙어서 같이 내려옴 */
  .drop-toggle {
    position: absolute;
    top: 100%;
    left: 76px;               /* 햄버거 버튼(18~60px) 바로 오른쪽 */
    width: 64px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid #2b2b2b;
    border-top: 0;
    border-radius: 0 0 10px 10px;
    background: #141414;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .drop-toggle svg {
    width: 14px;
    height: 8px;
    fill: #fff;
    shape-rendering: crispEdges;
    transition: transform 0.35s ease;
  }

  /* 열리면 화살표가 위를 향함 */
  .drop-menu.open .drop-toggle svg {
    transform: rotate(180deg);
  }

  @media (max-width: 480px) {
    .drop-toggle {
      left: 66px;             /* 모바일 햄버거 버튼(12~54px) 바로 오른쪽 */
    }

    .drop-list {
      padding-left: 59px;
    }
  }

  .menu-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    padding: 0.3em 0.4em;
    border: 0;
    background: transparent;
    color: #fff;
    font: inherit;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: none;
  }

  /* > 는 터치하거나 커서를 올렸을 때만 보임 (자리는 미리 잡아 둬서 글자가 흔들리지 않음) */
  .menu-link .arrow {
    visibility: hidden;
  }

  .menu-link:hover .arrow,
  .menu-link:focus-visible .arrow,
  .menu-link.touching .arrow {
    visibility: visible;
  }

  .menu-link:focus,
  .drop-toggle:focus {
    outline: none;
  }

  .drop-toggle:focus-visible {
    outline: 1px solid #fff;
  }

  /* ───── LP 아래 음원 재생 표시 (장식) ───── */
  .player {
    position: absolute;
    z-index: 25;
    left: 12.5%;
    width: 75%;
    top: calc(87.5% + 14px);
    color: #fff;
    font-family: "Galmuri11", "Galmuri9", monospace;
    text-align: center;
    pointer-events: none;
    user-select: none;
    -webkit-font-smoothing: none;
  }

  .player-title {
    font-size: 17px;
    line-height: 1;
    letter-spacing: 1px;
  }

  .player-bar {
    position: relative;
    height: 4px;
    margin: 12px 0 6px;
    background: #3a3a3a;
  }

  .player-bar::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 38%;
    background: #fff;
  }

  .player-bar::after {
    content: "";
    position: absolute;
    top: -3px;
    left: calc(38% - 5px);
    width: 10px;
    height: 10px;
    background: #fff;
  }

  .player-time {
    display: flex;
    justify-content: space-between;
    font-family: "Galmuri9", "Galmuri11", monospace;
    font-size: 11px;
    color: #8a8a8a;
  }

  .player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;
    margin-top: 6px;
  }

  .player-controls svg {
    height: 18px;
    width: auto;
    fill: #fff;
    shape-rendering: crispEdges;
  }

  .player-controls .play {
    height: 26px;
  }

  /* 가운데 고정 원 */
  .center-disc {
    position: absolute;
    z-index: 5;
    width: 31%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #c7c7c7;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
      0 4px 14px rgba(0,0,0,.45),
      inset 0 0 0 1px rgba(255,255,255,.35);
  }

  .center-hole {
    position: absolute;
    z-index: 6;
    width: 3.5%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #292929;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
  }

  /* LP를 읽는 톤암 — 위에서 내려다본 형태 */
  .tonearm {
    position: absolute;
    z-index: 20;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,.55));
  }

  .tonearm-base { fill: #151515; stroke: #262626; stroke-width: .3; }
  .tonearm-cap  { fill: url(#capMetal); stroke: #8a8a8a; stroke-width: .2; }

  .tonearm-bar {
    fill: none;
    stroke: #8e8e8e;
    stroke-width: 2.1;
    stroke-linecap: round;
  }

  .tonearm-bar-highlight {
    fill: none;
    stroke: rgba(255,255,255,.55);
    stroke-width: .6;
    stroke-linecap: round;
  }

  .headshell { fill: #1b1b1b; stroke: #3a3a3a; stroke-width: .25; }
  .headshell-lip { fill: #2a2a2a; }
  .headshell-screw { fill: #cfcfcf; }


  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .record {
      animation-play-state: paused;
    }
  }
</style>
</head>

    <div class="site-title">MuteF</div>
  </header>

  <!-- 상단 메뉴 창: 항목을 추가하면 세로로 쌓임. data-href = 이동할 파일 -->
  <nav class="drop-menu" id="dropMenu" aria-label="바로가기">
    <ul class="drop-list" id="dropList">
      <li>
        <button class="menu-link" type="button" data-href="calender.html">
          <span class="arrow" aria-hidden="true">&gt;</span><span>일정</span>
        </button>
      </li>
      <li>
        <button class="menu-link" type="button" data-href="members.html">
          <span class="arrow" aria-hidden="true">&gt;</span><span>멤버</span>
        </button>
      </li>
      <li>
        <button class="menu-link" type="button" data-href="timeline.html">
          <span class="arrow" aria-hidden="true">&gt;</span><span>타임라인</span>
        </button>
      </li>
    </ul>

    <button class="drop-toggle" id="dropToggle" type="button"
            aria-expanded="false" aria-controls="dropList" aria-label="메뉴 열기">
      <!-- 픽셀 화살표 (아래 방향, 열리면 뒤집힘) -->
      <svg viewBox="0 0 7 4" aria-hidden="true">
        <rect x="0" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/>
        <rect x="1" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/>
        <rect x="2" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/>
        <rect x="3" y="3" width="1" height="1"/>
      </svg>
    </button>
  </nav>

  <main class="home-page">
    <div class="turntable-stage">
      <div class="record" aria-label="회전하는 LP">
        <div class="center-disc"></div>
        <div class="center-hole" aria-hidden="true"></div>
        <div class="shine-mirror" aria-hidden="true"></div>
      </div>

      <!-- LP 아래 음원 재생 표시 — 장식용, 기능 없음 -->
      <div class="player" aria-hidden="true">
        <div class="player-title">Home</div>
        <div class="player-bar"></div>
        <div class="player-time"><span>1:24</span><span>3:41</span></div>
        <div class="player-controls">
          <!-- 이전 곡 -->
          <svg viewBox="0 0 7 10"><rect x="0" y="0" width="1" height="10"/><rect x="2" y="4" width="1" height="2"/><rect x="3" y="3" width="1" height="4"/><rect x="4" y="2" width="1" height="6"/><rect x="5" y="1" width="1" height="8"/><rect x="6" y="0" width="1" height="10"/></svg>
          <!-- 재생 -->
          <svg class="play" viewBox="0 0 5 10"><rect x="0" y="0" width="1" height="10"/><rect x="1" y="1" width="1" height="8"/><rect x="2" y="2" width="1" height="6"/><rect x="3" y="3" width="1" height="4"/><rect x="4" y="4" width="1" height="2"/></svg>
          <!-- 다음 곡 -->
          <svg viewBox="0 0 7 10"><rect x="0" y="0" width="1" height="10"/><rect x="1" y="1" width="1" height="8"/><rect x="2" y="2" width="1" height="6"/><rect x="3" y="3" width="1" height="4"/><rect x="4" y="4" width="1" height="2"/><rect x="6" y="0" width="1" height="10"/></svg>
        </div>
      </div>

      <svg class="tonearm" viewBox="0 0 100 100" aria-label="LP 톤암">
        <defs>
          <radialGradient id="capMetal" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#f2f2f2"/>
            <stop offset="55%" stop-color="#b5b5b5"/>
            <stop offset="100%" stop-color="#7a7a7a"/>
          </radialGradient>
        </defs>

        <!-- 톤암 전체 위치: 모양은 그대로 두고 이 translate 값으로만 이동 -->
        <g class="tonearm-group" transform="translate(1 -3)">
          <!-- 회전축 베이스 + 은색 캡: 베이스 윗부분이 LP 윗선(y=12.5)보다 내려오도록 배치 -->
          <circle class="tonearm-base" cx="86.6" cy="21.5" r="5.8"/>
          <circle class="tonearm-cap" cx="86.6" cy="21.5" r="3.2"/>

          <!-- 암: 은색 캡 위 레이어. 시작~바깥으로 휘는 부분은 사진과 동일,
               아래쪽에서 LP 안쪽으로 꺾여 들어옴 -->
          <path class="tonearm-bar" d="M86.6 21.5 L86.4 49 Q86.3 57, 79.2 62.1"/>
          <path class="tonearm-bar-highlight" transform="translate(-.35 0)" d="M86.6 21.7 L86.4 49 Q86.3 57, 79.2 62.1"/>

          <!-- 헤드쉘: 암 끝에 이어짐. 바늘 끝은 LP 오른쪽 아래, 반지름의 약 87% 지점 -->
          <g transform="translate(79.2 62.1) rotate(54.3)">
            <rect class="headshell" x="-2" y="-.6" width="4" height="7.8" rx=".4"/>
            <path class="headshell-lip" d="M-2 5.4 L-3.6 6.6 L-3.4 7.4 L-2 6.8 Z"/>
            <circle class="headshell-screw" cx="0" cy="5" r=".6"/>
          </g>
        </g>
      </svg>
    </div>
  </main>

  <script>
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");

    function openSidebar() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    document.querySelector(".menu-button").addEventListener("click", openSidebar);
    document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    // 사이드바 메뉴: 누르면 박스 표시 후 해당 파일로 이동
    // 파일 이름이나 위치가 바뀌면 각 버튼의 data-href만 수정하면 됩니다.
    const sidebarLinks = document.querySelectorAll(".sidebar-link");

    sidebarLinks.forEach(function(link) {
      link.addEventListener("click", function() {
        link.classList.add("active");
        window.location.href = link.dataset.href;
      });
    });

    // 상단 메뉴 창 열기/닫기
    const dropMenu = document.getElementById("dropMenu");
    const dropToggle = document.getElementById("dropToggle");

    function setDropMenu(open) {
      dropMenu.classList.toggle("open", open);
      dropToggle.setAttribute("aria-expanded", String(open));
      dropToggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
    }

    dropToggle.addEventListener("click", function() {
      setDropMenu(!dropMenu.classList.contains("open"));
    });

    // 창 바깥을 누르거나 Esc를 누르면 닫힘
    document.addEventListener("pointerdown", function(event) {
      if (!event.target.closest("#dropMenu")) setDropMenu(false);
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") setDropMenu(false);
    });

    // 메뉴 항목: 터치하는 동안 > 표시, 누르면 잠깐 보여준 뒤 이동
    document.querySelectorAll(".menu-link").forEach(function(link) {
      link.addEventListener("pointerdown", function() {
        link.classList.add("touching");
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach(function(type) {
        link.addEventListener(type, function(event) {
          if (event.pointerType !== "mouse") {
            setTimeout(() => link.classList.remove("touching"), 150);
          }
        });
      });
      link.addEventListener("click", function() {
        link.classList.add("touching");
        setTimeout(() => { window.location.href = link.dataset.href; }, 150);
      });
    });

    // ───── 사이드바 아래 프로필: index.html에서 로그인한 ID ─────
    // (이 브라우저에 저장된 값이라 진짜 보안 로그인은 아님)
    const USER_KEY = "mutef-user";

    function getCurrentUser() {
      try {
        return localStorage.getItem(USER_KEY);
      } catch (e) {
        return null;
      }
    }

    // ───── 프로필 사진 (Supabase: profiles 표 + avatars 사진 보관함) ─────
    const PROFILE_DB = {
      url: "https://xbvormcnoexpxtjoioko.supabase.co",
      key: "sb_publishable_WUlX-m46GveYJsrJ837LsQ_732EGb8R"
    };
    const AVATAR_CACHE_KEY = "mutef-avatar";   // 화면을 열자마자 보이도록 이 브라우저에 기억

    // 기본 이미지: 검은 바탕에 흰 흉상
    const DEFAULT_AVATAR = `<svg viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" fill="#000"/>
      <circle cx="20" cy="15.5" r="7" fill="#fff"/>
      <path d="M5 40c0-8.6 6.7-14.5 15-14.5S35 31.4 35 40Z" fill="#fff"/>
    </svg>`;

    function avatarUrl(path) {
      return `${PROFILE_DB.url}/storage/v1/object/public/avatars/${path}`;
    }

    // el 안에 프로필 사진(없으면 기본 이미지)을 그림
    function fillAvatar(el, path) {
      el.innerHTML = "";
      if (path) {
        const img = document.createElement("img");
        img.src = avatarUrl(path);
        img.alt = "";
        img.onerror = () => { el.innerHTML = DEFAULT_AVATAR; };
        el.appendChild(img);
      } else {
        el.innerHTML = DEFAULT_AVATAR;
      }
    }

    function readAvatarCache() {
      try {
        const cache = JSON.parse(localStorage.getItem(AVATAR_CACHE_KEY));
        return cache && cache.id === getCurrentUser() ? cache.path : "";
      } catch (e) {
        return "";
      }
    }

    function writeAvatarCache(path) {
      try {
        localStorage.setItem(AVATAR_CACHE_KEY, JSON.stringify({ id: getCurrentUser(), path }));
      } catch (e) { /* 무시 */ }
    }

    function renderProfile() {
      const user = getCurrentUser();
      const avatar = document.getElementById("profileAvatar");
      fillAvatar(avatar, user ? readAvatarCache() : "");
      avatar.disabled = !user;
      avatar.setAttribute("aria-label", user ? "프로필 사진 바꾸기" : "프로필 사진");
      document.getElementById("profileName").textContent = user || "로그인 안 됨";
      document.getElementById("profileAction").textContent = user ? "로그아웃" : "로그인";
      if (user) refreshMyAvatar();
    }

    // 저장된 내 프로필 사진 경로를 Supabase에서 다시 확인
    async function refreshMyAvatar() {
      const user = getCurrentUser();
      try {
        const res = await fetch(`${PROFILE_DB.url}/rest/v1/profiles?select=avatar_path&id=eq.${encodeURIComponent(user)}`, {
          headers: { apikey: PROFILE_DB.key }
        });
        if (!res.ok) return;
        const rows = await res.json();
        const path = rows.length ? rows[0].avatar_path : "";
        if (path !== readAvatarCache()) {
          writeAvatarCache(path);
          fillAvatar(document.getElementById("profileAvatar"), path);
        }
      } catch (e) { /* 인터넷이 안 되면 기억해 둔 사진 그대로 */ }
    }

    // 내 프로필 사진 저장 (path가 ""이면 기본 이미지)
    async function saveMyAvatar(path) {
      const res = await fetch(`${PROFILE_DB.url}/rest/v1/profiles?on_conflict=id`, {
        method: "POST",
        headers: {
          apikey: PROFILE_DB.key,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=representation"
        },
        body: JSON.stringify({ id: getCurrentUser(), avatar_path: path, updated_at: new Date().toISOString() })
      });
      if (!res.ok) throw new Error(`프로필 저장 실패 (${res.status})`);
    }

    // 사진을 가운데 기준 정사각형 400px JPEG로 잘라서 올림
    async function uploadAvatar(file) {
      const url = URL.createObjectURL(file);
      let blob;
      try {
        const img = await new Promise((resolve, reject) => {
          const el = new Image();
          el.onload = () => resolve(el);
          el.onerror = () => reject(new Error("사진을 읽지 못했어요"));
          el.src = url;
        });
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 400;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, 400, 400);
        ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 400, 400);
        blob = await new Promise((resolve, reject) => {
          canvas.toBlob(b => b ? resolve(b) : reject(new Error("사진 변환 실패")), "image/jpeg", 0.88);
        });
      } finally {
        URL.revokeObjectURL(url);
      }

      const name = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : Date.now().toString(36) + Math.random().toString(36).slice(2);
      const path = `${name}.jpg`;
      const res = await fetch(`${PROFILE_DB.url}/storage/v1/object/avatars/${path}`, {
        method: "POST",
        headers: { apikey: PROFILE_DB.key, "Content-Type": "image/jpeg" },
        body: blob
      });
      if (!res.ok) throw new Error(`사진 올리기 실패 (${res.status})`);
      return path;
    }

    function removeAvatarFile(path) {
      if (!path) return;
      fetch(`${PROFILE_DB.url}/storage/v1/object/avatars/${path}`, {
        method: "DELETE",
        headers: { apikey: PROFILE_DB.key }
      }).catch(() => {});
    }

    // 프로필 사진을 누르면: 사진 변경 / 기본 이미지로
    const profileMenu = document.getElementById("profileMenu");
    const avatarInput = document.getElementById("avatarInput");
    const profileNote = document.getElementById("profileNote");

    function showProfileNote(text) {
      profileNote.textContent = text;
      profileNote.classList.toggle("hidden", !text);
    }

    document.getElementById("profileAvatar").addEventListener("click", function(event) {
      event.stopPropagation();
      if (!getCurrentUser()) return;
      profileMenu.classList.toggle("hidden");
    });

    document.addEventListener("click", function(event) {
      if (!event.target.closest("#profileMenu")) profileMenu.classList.add("hidden");
    });

    document.getElementById("avatarChange").addEventListener("click", function() {
      profileMenu.classList.add("hidden");
      avatarInput.click();
    });

    avatarInput.addEventListener("change", async function() {
      const file = avatarInput.files[0];
      avatarInput.value = "";
      if (!file) return;

      const oldPath = readAvatarCache();
      showProfileNote("사진 올리는 중…");
      let newPath = null;
      try {
        newPath = await uploadAvatar(file);
        await saveMyAvatar(newPath);
        writeAvatarCache(newPath);
        fillAvatar(document.getElementById("profileAvatar"), newPath);
        removeAvatarFile(oldPath);
        showProfileNote("");
      } catch (e) {
        console.error(e);
        removeAvatarFile(newPath);
        showProfileNote("사진을 바꾸지 못했어요");
      }
    });

    document.getElementById("avatarReset").addEventListener("click", async function() {
      profileMenu.classList.add("hidden");
      const oldPath = readAvatarCache();
      try {
        await saveMyAvatar("");
        writeAvatarCache("");
        fillAvatar(document.getElementById("profileAvatar"), "");
        removeAvatarFile(oldPath);
        showProfileNote("");
      } catch (e) {
        console.error(e);
        showProfileNote("사진을 바꾸지 못했어요");
      }
    });

    // 로그아웃: 저장된 ID를 지우고 로그인 화면으로 / 로그인 안 됐으면 로그인 화면으로
    document.getElementById("profileAction").addEventListener("click", function() {
      try {
        localStorage.removeItem(USER_KEY);
      } catch (e) { /* 무시 */ }
      window.location.href = "index.html";
    });

    renderProfile();

    // 메뉴 버튼이 아닌 다른 곳을 누르면 박스가 사라짐
    document.addEventListener("pointerdown", function(event) {
      if (!event.target.closest(".sidebar-link")) {
        sidebarLinks.forEach(link => link.classList.remove("active"));
      }
    });
  </script>
</body>
</html>
